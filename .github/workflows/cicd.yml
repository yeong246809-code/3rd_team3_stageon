name: Java CI with Gradle
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2.6.0
        with:
          arguments: build

      - name: Get JAR_FILE
        id: jarfile
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          echo "JAR_FILE=${JAR_FILE}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ env.JAR_FILE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: stageon-production
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: build/libs/

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.AWS_EC2_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Copy JAR to EC2
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          scp -i private_key.pem \
            -o StrictHostKeyChecking=no \
            $JAR_FILE \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/app-new.jar
      
      - name: Restart Spring Application on EC2
        run: |
          ssh -i private_key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'EOF'
            set -Eeuo pipefail

            APP_DIR="$HOME"
            NEW_JAR="$APP_DIR/app-new.jar"
            CURRENT_JAR="$APP_DIR/app.jar"
            PREVIOUS_JAR="$APP_DIR/app-previous.jar"
            PID_FILE="$APP_DIR/app.pid"
            LOG_FILE="$APP_DIR/app.log"
            DEPLOY_STARTED=0

            stop_application() {
              if [ -f "$PID_FILE" ]; then
                APP_PID=$(cat "$PID_FILE")
                if kill -0 "$APP_PID" 2>/dev/null; then
                  kill "$APP_PID"
                  for _ in $(seq 1 10); do
                    kill -0 "$APP_PID" 2>/dev/null || break
                    sleep 1
                  done
                  kill -0 "$APP_PID" 2>/dev/null && kill -9 "$APP_PID"
                fi
                rm -f "$PID_FILE"
                return
              fi

              LEGACY_PIDS=$(pgrep -f "java -jar $APP_DIR/" || true)
              if [ -n "$LEGACY_PIDS" ]; then
                echo "$LEGACY_PIDS" | xargs kill
                sleep 3
                LEGACY_PIDS=$(pgrep -f "java -jar $APP_DIR/" || true)
                [ -z "$LEGACY_PIDS" ] || echo "$LEGACY_PIDS" | xargs kill -9
              fi
            }

            start_application() {
              nohup java -jar "$1" > "$LOG_FILE" 2>&1 &
              echo $! > "$PID_FILE"
            }

            wait_for_health() {
              for _ in $(seq 1 30); do
                HEALTH_RESPONSE=$(curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null || true)
                if echo "$HEALTH_RESPONSE" | grep -q '"status":"UP"'; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            rollback() {
              EXIT_CODE=$?
              trap - ERR

              if [ "$DEPLOY_STARTED" -eq 1 ] && [ -f "$PREVIOUS_JAR" ]; then
                echo "Deployment failed. Rolling back to the previous version."
                stop_application || true
                cp -f "$PREVIOUS_JAR" "$CURRENT_JAR"
                start_application "$CURRENT_JAR"

                if wait_for_health; then
                  echo "Rollback completed successfully."
                else
                  echo "Rollback started, but the previous version failed its health check."
                fi
              else
                echo "Deployment failed and no previous version is available."
              fi

              exit "$EXIT_CODE"
            }

            trap rollback ERR

            if [ ! -f "$NEW_JAR" ]; then
              echo "New deployment JAR was not found."
              false
            fi

            if [ -f "$CURRENT_JAR" ]; then
              cp -f "$CURRENT_JAR" "$PREVIOUS_JAR"
            else
              LEGACY_JAR=$(find "$APP_DIR" -maxdepth 1 -type f -name '*.jar' \
                ! -name 'app-new.jar' \
                ! -name 'app.jar' \
                ! -name 'app-previous.jar' \
                | head -n 1)
              if [ -n "$LEGACY_JAR" ]; then
                cp -f "$LEGACY_JAR" "$PREVIOUS_JAR"
              fi
            fi

            DEPLOY_STARTED=1
            stop_application
            mv -f "$NEW_JAR" "$CURRENT_JAR"
            start_application "$CURRENT_JAR"

            if ! wait_for_health; then
              echo "New version failed the health check."
              false
            fi

            DEPLOY_STARTED=0
            trap - ERR
            echo "Deployment completed successfully."
          EOF
      - name: Cleanup
        if: always()
        run: rm -f private_key.pem
