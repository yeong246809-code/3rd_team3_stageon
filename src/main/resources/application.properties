spring.application.name=stageon
server.servlet.context-path=/
spring.config.import=optional:file:./.env[.properties]

# 홈 안개 특집 공연 ID입니다. 0이면 현재 정적 시안을 유지합니다.
stageon.home.featured-performance-id=${HOME_FEATURED_PERFORMANCE_ID:0}

#파일업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=uploads
spring.servlet.multipart.max-file-size=10MB

#DataSource
spring.datasource.url=jdbc:mysql://52.78.60.210:3306/stageon
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=project
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
