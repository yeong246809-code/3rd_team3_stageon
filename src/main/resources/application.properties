spring.application.name=stageon

# MySQL
# 운영/팀원 환경에서는 아래 환경변수만 각자 설정하면 됩니다.
# STAGEON_DB_URL, STAGEON_DB_USERNAME, STAGEON_DB_PASSWORD
spring.datasource.url=${STAGEON_DB_URL:jdbc:mysql://127.0.0.1:3306/stageon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${STAGEON_DB_USERNAME:root}
spring.datasource.password=${STAGEON_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 현재 화면/공통 구조 개발 단계에서는 MySQL이 꺼져 있어도 애플리케이션을 기동합니다.
# 실제 DB 접근 시에는 위 MySQL 접속 정보와 stageon 데이터베이스가 필요합니다.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.mode=never
