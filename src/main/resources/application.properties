spring.application.name=stageon
server.servlet.context-path=/

#파일업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=uploads
spring.servlet.multipart.max-file-size=10MB

#DataSource
spring.datasource.url=jdbc:mysql://52.78.60.210:3306/stageon
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=project
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}

#S3 버킷 설정
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.image-prefix=${AWS_S3_IMAGE_PREFIX:image/}
aws.s3.file-prefix=${AWS_S3_FILE_PREFIX:file/}