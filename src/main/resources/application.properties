spring.application.name=stageon
server.servlet.context-path=/
spring.config.import=optional:file:./.env[.properties],optional:file:./stageon-ai-gateway/.env[.properties]

# 홈 안개 특집 공연 ID입니다. 0이면 현재 정적 시안을 유지합니다.
stageon.home.featured-performance-id=${HOME_FEATURED_PERFORMANCE_ID:0}

# 전체 오류 로그는 명시적으로 켠 개발·테스트 환경에서만 화면에 표시합니다.
stageon.error.show-full-log=${STAGEON_ERROR_SHOW_FULL_LOG:false}

#파일업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 관리자 이미지 저장소. 운영 EC2에서는 STORAGE_TYPE=s3로 설정합니다.
stageon.storage.type=${STORAGE_TYPE:local}
stageon.storage.media-url-prefix=${MEDIA_URL_PREFIX:/media}
stageon.storage.local-root=${LOCAL_STORAGE_ROOT:uploads/media}
stageon.storage.s3.bucket=${S3_BUCKET:}
stageon.storage.s3.region=${S3_REGION:us-east-1}
stageon.storage.s3.banner-prefix=${S3_BANNER_PREFIX:image/banners}
stageon.storage.s3.poster-prefix=${S3_POSTER_PREFIX:image/posters}
stageon.storage.s3.file-prefix=${S3_FILE_PREFIX:file}

#DataSource
spring.datasource.url=jdbc:mysql://54.116.153.192:3306/stageon
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=project
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Redis 대기열 기본값: 대기 2시간, 입장 후 좌석 선택 권한 10분
stageon.queue.waiting-ttl=${QUEUE_WAITING_TTL:2h}
stageon.queue.admission-ttl=${QUEUE_ADMISSION_TTL:10m}
stageon.queue.admit-batch-size=${QUEUE_ADMIT_BATCH_SIZE:10}
stageon.queue.process-interval-ms=${QUEUE_PROCESS_INTERVAL_MS:2000}
stageon.queue.expiration-scan-interval-ms=${QUEUE_EXPIRATION_SCAN_INTERVAL_MS:60000}
stageon.queue.cookie-secure=${QUEUE_COOKIE_SECURE:false}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ngrok 설정 -- 로컬환경테스트용
toss.webhook-url=${MY_LOCAL_WEBHOOK}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 로컬 AI 게이트웨이는 메인 Spring만 호출하며 브라우저에는 API 키를 노출하지 않습니다.
stageon.ai.gateway-url=${STAGEON_AI_GATEWAY_URL:http://127.0.0.1:8081}
stageon.ai.api-key=${STAGEON_AI_API_KEY:}
stageon.ai.connect-timeout=${STAGEON_AI_CONNECT_TIMEOUT:5s}
stageon.ai.response-timeout=${STAGEON_AI_RESPONSE_TIMEOUT:240s}
stageon.ai.memory-ttl=${STAGEON_AI_MEMORY_TTL:30m}
stageon.ai.memory-max-turns=${STAGEON_AI_MEMORY_MAX_TURNS:5}
stageon.ai.memory-mode=${STAGEON_AI_MEMORY_MODE:conversation-first}
