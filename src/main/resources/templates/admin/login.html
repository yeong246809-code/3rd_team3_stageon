

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn Admin | 로그인</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
</head>
<body>
<main class="admin-login">
  <section class="admin-login__brand">
    <div>
      <a class="admin-brand" th:href="@{/}" href="/">StageOn<small>ADMIN CONSOLE</small></a>
      <h1 style="margin-top:80px;font-size:42px">공연 운영의<br>모든 순간을 한곳에서</h1>
      <p style="margin-top:18px;color:#94a3b8">공연, 회차, 좌석 선점과 주문 상태를 통합 관리합니다.</p>
    </div>
    <small>Authorized personnel only</small>
  </section>
  <section class="admin-login__form">
    <div class="auth-wrap" th:classappend="${param.error} ? 'shake'">
      <span class="eyebrow">ADMIN LOGIN</span>
      <h1 style="font-size:32px;margin-top:8px">관리자 로그인</h1>
      <p th:if="${param.error}" style="color:#dc2626;margin-top:12px" th:switch="${param.error[0]}">
        <span th:case="'empty'">아이디 또는 비밀번호를 입력해주세요.</span>
        <span th:case="'invalid'">아이디 또는 비밀번호가 틀렸습니다.</span>
        <span th:case="'inactive'">사용할 수 없는 계정 상태입니다.</span>
        <span th:case="*">로그인이 필요합니다.</span>
      </p>
      <form id="admin-login-form" class="stack" style="margin-top:28px" th:action="@{/admin/login}" method="post">
        <div class="field field--icon">
          <label for="admin-email">관리자 이메일</label>
          <span class="field-icon" aria-hidden="true">
            <svg class="icon-default" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <svg class="icon-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
          </span>
          <input id="admin-email" class="input input--icon" type="email" name="email" placeholder="admin@stageon.co.kr" autofocus>
        </div>
        <div class="field field--icon">
          <label for="admin-password">비밀번호</label>
          <span class="field-icon" aria-hidden="true">
            <svg class="icon-default" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <svg class="icon-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
          </span>
          <input id="admin-password" class="input input--icon" type="password" name="password" placeholder="비밀번호 입력">
          <button type="button" class="pw-toggle" id="pw-toggle-btn" aria-label="비밀번호 표시">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button class="btn btn--dark btn--wide" type="submit" id="login-submit-btn">
          <span class="spinner"></span><span>관리자 콘솔 로그인</span>
        </button>
      </form>
    </div>
  </section>
</main>
<script th:src="@{/js/admin-login.js}" src="/js/admin-login.js"></script>
</body>
</html>
