<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
  </head>
  <body>
    <main class="admin-login">
      <section class="admin-login__brand">
        <div>
          <a class="admin-brand" th:href="@{/}" href="/">StageOn<small>ADMIN CONSOLE</small></a>
          <h1 style="margin-top:80px;font-size:42px">
            공연 운영의
            <br>
            모든 순간을 한곳에서
          </h1>
          <p style="margin-top:18px;color:#94a3b8">공연, 회차, 좌석 선점과 주문 상태를 통합 관리합니다.</p>
        </div>
        <small>Authorized personnel only</small>
      </section>
      <section class="admin-login__form">
        <div class="auth-wrap">
          <span class="eyebrow">ADMIN LOGIN</span>
          <h1 style="font-size:32px;margin-top:8px">관리자 로그인</h1>
          <form class="stack" style="margin-top:28px">
            <div class="field">
              <label for="admin-email">관리자 이메일</label>
              <input id="admin-email" class="input" type="email" placeholder="admin@stageon.co.kr">
            </div>
            <div class="field">
              <label for="admin-password">비밀번호</label>
              <input id="admin-password" class="input" type="password" placeholder="비밀번호 입력">
            </div>
            <a class="btn btn--dark btn--wide" th:href="@{/admin/dashboard}" href="/admin/dashboard">관리자 콘솔 로그인 시안</a>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
