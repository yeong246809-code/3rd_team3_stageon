


<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.id != null} ? 'StageOn Admin | 버전 이력 수정' : 'StageOn Admin | 버전 이력 등록'">StageOn Admin | 버전 이력 등록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-versions.css}" href="/css/pages/admin-versions.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1 th:text="${form.id != null} ? '버전 이력 수정' : '버전 이력 등록'">버전 이력 등록</h1>
                    <p>배포 버전별 내용을 기록합니다.</p>
                </div>
            </header>

            <div class="card">
                <form method="post"
                      th:action="${form.id != null} ? @{'/admin/versions/' + ${form.id}} : @{/admin/versions}"
                      th:object="${form}">

                    <div class="admin-form-grid">
                        <div class="form-field">
                            <label class="section-heading">버전<span class="required-mark">*</span></label>
                            <input class="input" type="text" th:field="*{version}" placeholder="예: v1.0" required>
                        </div>
                        <div class="form-field">
                            <label class="section-heading">배포자<span class="required-mark">*</span></label>
                            <input class="input" type="text" th:field="*{author}" placeholder="배포자명" required>
                        </div>
                        <div class="form-field">
                            <label class="section-heading">배포일자<span class="required-mark">*</span></label>
                            <input class="input" type="date" th:field="*{releasedAt}" required>
                        </div>
                    </div>

                    <div class="form-field" style="margin-top:18px;">
                        <label class="section-heading">내용</label>
                        <textarea class="input" th:field="*{description}" rows="10"
                                  placeholder="배포 내용을 입력하세요." style="width:100%; resize:vertical;"></textarea>
                    </div>

                    <div class="cluster" style="margin-top:24px; justify-content:flex-end;">
                        <a class="btn btn--ghost" th:href="@{/admin/versions}">취소</a>
                        <button type="submit" class="btn btn--dark" th:text="${form.id != null} ? '수정 완료' : '등록'">등록</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
