
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn Admin | 공연 등록·수정</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
</head>
<body>
<div class="admin-page">
  <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
  <main class="admin-main">
    <div th:replace="~{fragments/admin/admin-header :: header}"></div>
    <div class="admin-content">
      <header class="admin-title">
        <div>
          <h1 th:text="${readOnly} ? '공연 정보 보기' : (${form.id} != null ? '공연 수정' : '공연 등록')">공연 등록·수정</h1>
          <p th:text="${readOnly} ? '읽기 전용입니다. 수정하려면 목록에서 수정 버튼을 이용하세요.' : 'KOPIS 연동 데이터와 운영 정보를 관리합니다.'">KOPIS 연동 데이터와 운영 정보를 관리합니다.</p>
        </div>
        <div class="cluster">
          <a class="btn" th:href="@{/admin/performances}">목록으로</a>
          <button class="btn btn--draft" th:unless="${readOnly}" type="submit" form="performanceForm" name="draft" value="true">임시 저장</button>
          <button class="btn btn--dark" th:unless="${readOnly}" type="submit" form="performanceForm" name="draft" value="false">저장</button>
        </div>
      </header>
      <form id="performanceForm" class="card stack" method="post" enctype="multipart/form-data"
            th:classappend="${readOnly} ? ' form--readonly' : ''"
            th:object="${form}"
            th:action="${form.id} != null ? @{'/admin/performances/' + ${form.id}} : @{/admin/performances}">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{posterUrl}">

        <h2>포스터</h2>
        <div class="poster-upload">
          <img class="poster-preview" id="posterPreview"
               th:src="${form.posterUrl} ?: '#'"
               th:if="${form.posterUrl}" alt="포스터 미리보기"
               onerror="this.style.display='none'; document.getElementById('posterPreviewEmpty').style.display='flex';">
          <div class="poster-preview poster-preview--empty" id="posterPreviewEmpty"
               th:style="${form.posterUrl} ? 'display:none' : 'display:flex'">
            이미지 없음
          </div>
          <div class="field" th:unless="${readOnly}">
            <label>포스터 이미지 업로드</label>
            <input class="input" type="file" name="posterFile" accept="image/*" onchange="previewPoster(this)">
          </div>
        </div>

        <h2>기본 정보</h2>
        <div class="admin-form-grid">
          <div class="field">
            <label>공연명</label>
            <input class="input" th:field="*{title}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>KOPIS 공연 ID</label>
            <input class="input" th:field="*{kopisId}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>장르</label>
            <select class="select" th:field="*{genre}" th:disabled="${readOnly}">
              <option value="뮤지컬">뮤지컬</option>
              <option value="연극">연극</option>
              <option value="콘서트">콘서트</option>
              <option value="클래식">클래식</option>
              <option value="무용">무용</option>
            </select>
          </div>
          <div class="field">
            <label>관람 등급</label>
            <select class="select" th:field="*{ageText}" th:disabled="${readOnly}">
              <option value="전체 이용가">전체 이용가</option>
              <option value="7세 이용가">7세 이용가</option>
              <option value="12세 이용가">12세 이용가</option>
              <option value="15세 이용가">15세 이용가</option>
              <option value="19세 이용가">19세 이용가</option>
            </select>
          </div>
          <div class="field">
            <label>공연 시작일</label>
            <input class="input" type="date" th:field="*{startDate}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>공연 종료일</label>
            <input class="input" type="date" th:field="*{endDate}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>상영 시간(분)</label>
            <input class="input" type="number" th:field="*{runtimeMinutes}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>상태</label>
            <select class="select" th:field="*{status}" th:disabled="${readOnly}">
              <option value="UPCOMING">공개예정</option>
              <option value="ON_SALE">판매중</option>
              <option value="ENDED">종료</option>
              <option value="CANCELLED">취소</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>공연 소개</label>
          <textarea class="textarea" th:field="*{story}" th:readonly="${readOnly}"></textarea>
        </div>
      </form>
    </div>
  </main>
</div>

<script th:inline="javascript">
  function previewPoster(input) {
    if (!input.files || !input.files[0]) return;
    var url = URL.createObjectURL(input.files[0]);
    var img = document.getElementById('posterPreview');
    var empty = document.getElementById('posterPreviewEmpty');
    empty.style.display = 'none';
    if (!img) {
      img = document.createElement('img');
      img.id = 'posterPreview';
      img.className = 'poster-preview';
      empty.insertAdjacentElement('beforebegin', img);
    }
    img.style.display = 'block';
    img.src = url;
  }
</script>
</body>
</html>
