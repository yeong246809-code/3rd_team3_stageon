
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>StageOn Admin | 공연 등록·수정</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
  <link rel="stylesheet" th:href="@{/css/pages/performance-form.css}" href="/css/pages/performance-form.css">
</head>
<body>
<div class="admin-page">
  <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
  <main class="admin-main">
    <div th:replace="~{fragments/admin/admin-header :: header}"></div>
    <div class="admin-content">
      <header class="admin-title">
        <div>
          <h1 th:text="${readOnly} ? '공연 정보 보기' : (${form.id} != null ? '공연 수정' : '공연 등록')">공연 등록·수정</h1>
          <p th:text="${readOnly} ? '읽기 전용입니다. 수정하려면 목록에서 수정 버튼을 이용하세요.' : 'KOPIS 연동 데이터와 운영 정보를 관리합니다.'">KOPIS 연동 데이터와 운영 정보를 관리합니다.</p>
        </div>
        <div class="cluster">
          <a class="btn" th:href="@{/admin/performances}">목록으로</a>
          <button class="btn btn--draft" th:unless="${readOnly}" type="submit" form="performanceForm" name="draft" value="true" formnovalidate>임시 저장</button>
          <button class="btn btn--dark" th:unless="${readOnly}" type="submit" form="performanceForm" name="draft" value="false">저장</button>
        </div>
      </header>

      <div class="form-error-banner" th:if="${errorMessage}" th:text="${errorMessage}"
           style="background:#fdecea;color:#b3261e;border:1px solid #f5c2c0;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px;">
      </div>

      <form id="performanceForm" class="card stack" method="post" enctype="multipart/form-data"
            th:classappend="${readOnly} ? ' form--readonly' : ''"
            th:object="${form}"
            th:action="${form.id} != null ? @{'/admin/performances/' + ${form.id}} : @{/admin/performances}">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{posterUrl}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <h2>포스터</h2>
        <div class="poster-upload">
          <img class="poster-preview" id="posterPreview"
               th:src="${form.posterUrl} ?: '#'"
               th:if="${form.posterUrl}" alt="포스터 미리보기"
               onerror="this.style.display='none'; document.getElementById('posterPreviewEmpty').style.display='flex';">
          <div class="poster-preview poster-preview--empty" id="posterPreviewEmpty"
               th:style="${form.posterUrl} ? 'display:none' : 'display:flex'">
            이미지 없음
          </div>
          <div class="field" th:unless="${readOnly}">
            <label>포스터 이미지 업로드</label>
            <input class="input file-input" type="file" name="posterFile" accept="image/*" onchange="previewPoster(this)">
          </div>
        </div>

        <div class="section-heading">
          <h2>기본 정보</h2>
          <span class="required-guide" th:unless="${readOnly}"><span class="required-mark">*</span> 표시는 필수 항목입니다.</span>
        </div>
        <div class="admin-form-grid">
          <div class="field">
            <label>공연명 <span class="required-mark" th:unless="${readOnly}">*</span></label>
            <input class="input" th:field="*{title}" th:readonly="${readOnly}" th:required="${!readOnly}">
          </div>
          <div class="field">
            <label>KOPIS 공연 ID</label>
            <input class="input" th:field="*{kopisId}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>장르 <span class="required-mark" th:unless="${readOnly}">*</span></label>
            <select class="select" th:field="*{genre}" th:disabled="${readOnly}" th:required="${!readOnly}">
              <option value="">선택하세요</option>
              <option value="뮤지컬">뮤지컬</option>
              <option value="연극">연극</option>
              <option value="콘서트">콘서트</option>
              <option value="클래식">클래식</option>
              <option value="무용">무용</option>
            </select>
          </div>
          <div class="field">
            <label>관람 등급 <span class="required-mark" th:unless="${readOnly}">*</span></label>
            <select class="select" th:field="*{ageText}" th:disabled="${readOnly}" th:required="${!readOnly}">
              <option value="">선택하세요</option>
              <option value="전체 이용가">전체 이용가</option>
              <option value="7세 이용가">7세 이용가</option>
              <option value="12세 이용가">12세 이용가</option>
              <option value="15세 이용가">15세 이용가</option>
              <option value="19세 이용가">19세 이용가</option>
            </select>
          </div>
          <div class="field">
            <label>공연 시작일 <span class="required-mark" th:unless="${readOnly}">*</span></label>
            <input class="input" type="date" th:field="*{startDate}" th:readonly="${readOnly}" th:required="${!readOnly}">
          </div>
          <div class="field">
            <label>공연 종료일 <span class="required-mark" th:unless="${readOnly}">*</span></label>
            <input class="input" type="date" th:field="*{endDate}" th:readonly="${readOnly}" th:required="${!readOnly}">
          </div>
          <div class="field">
            <label>상영 시간(분)</label>
            <input class="input" type="number" th:field="*{runtimeMinutes}" th:readonly="${readOnly}">
          </div>
          <div class="field">
            <label>상태</label>
            <select class="select" th:field="*{status}" th:disabled="${readOnly}">
              <option value="UPCOMING">공개예정</option>
              <option value="ON_SALE">판매중</option>
              <option value="ENDED">종료</option>
              <option value="CANCELLED">취소</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>공연 소개</label>
          <textarea class="textarea" th:field="*{story}" th:readonly="${readOnly}"></textarea>
        </div>

        <div class="section-heading">
          <h2>공연장 · 가격</h2>
        </div>
        <div class="venue-price-section">
          <div class="admin-form-grid">
            <div class="field">
              <label>공연장 선택</label>
              <select class="select" id="hallSelect" th:field="*{hallId}" th:disabled="${readOnly}">
                <option value="">선택하세요</option>
                <option th:each="h : ${halls}" th:value="${h.hallId}"
                        th:text="${h.venueName} + ' - ' + ${h.hallName}"
                        th:if="${h.hallId != null}">공연장 - 홀</option>
              </select>
            </div>
            <div class="field">
              <label>공연 가격(기본)</label>
              <input class="input" type="number" th:field="*{basePrice}" th:readonly="${readOnly}" placeholder="예: 150000">
            </div>
            <div class="field" th:unless="${readOnly}">
              <label>&nbsp;</label>
              <button type="button" id="openSeatPriceModalBtn" onclick="openSeatPriceModal()" disabled>🎟 좌석/가격 설정</button>
              <p id="seatPriceSummary" style="font-size:12px;color:var(--subtle);margin-top:6px">공연장을 먼저 선택하세요.</p>
            </div>
          </div>
        </div>

        <div id="seatPriceHiddenInputs"></div>
      </form>

      <!-- 좌석/가격 설정 모달 -->
      <div id="seatPriceModal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
        <div class="modal-box" style="background:#fff;border-radius:12px;padding:28px;width:720px;max-width:92vw;max-height:86vh;overflow-y:auto;">
          <h3 style="margin-bottom:16px">좌석 배치도 · 등급별 가격 설정</h3>

          <div id="seatMapPreview" style="background:#fafafa;border-radius:10px;padding:18px;margin-bottom:20px;text-align:center;">
            <p id="seatMapEmpty" style="display:none;color:var(--subtle);font-size:13px">등록된 좌석이 없습니다. 공연장·좌석 관리에서 좌석을 먼저 등록해주세요.</p>
            <div id="seatMapStage" style="background:#1a1a1a;color:#fff;border-radius:6px;padding:6px;margin-bottom:14px;font-size:12px;letter-spacing:2px;">STAGE</div>
            <div id="seatMapSections"></div>
          </div>

          <h4 style="margin-bottom:6px">등급별 가격</h4>
          <p style="font-size:12px;color:var(--subtle);margin-bottom:10px">등급명은 직접 입력해 바꿀 수 있습니다. 변경한 이름은 확인 버튼을 누르면 바로 저장됩니다.</p>
          <div id="seatGradeList" class="stack" style="gap:12px;"></div>
          <p id="seatGradeEmpty" style="display:none;color:var(--subtle);font-size:13px">등록된 좌석 등급이 없습니다. 공연장·좌석 관리에서 먼저 등급을 등록해주세요.</p>

          <div class="cluster" style="justify-content:flex-end;margin-top:22px;gap:8px">
            <button type="button" class="btn" onclick="closeSeatPriceModal()">취소</button>
            <button type="button" class="btn btn--dark" id="confirmSeatPricesBtn" onclick="confirmSeatPrices()">확인</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script th:inline="javascript">
  function previewPoster(input) {
    if (!input.files || !input.files[0]) return;
    var url = URL.createObjectURL(input.files[0]);
    var img = document.getElementById('posterPreview');
    var empty = document.getElementById('posterPreviewEmpty');
    empty.style.display = 'none';
    if (!img) {
      img = document.createElement('img');
      img.id = 'posterPreview';
      img.className = 'poster-preview';
      empty.insertAdjacentElement('beforebegin', img);
    }
    img.style.display = 'block';
    img.src = url;
  }

  // 수정 화면에서 기존에 저장된 등급별 가격 (서버가 미리 채워줌)
  var existingSeatPrices = /*[[${form.seatPrices}]]*/ [];
  var currentGrades = []; // 모달 오픈 시 불러온 해당 홀의 등급 목록
  var savedPrices = {};   // gradeId -> price (확정된 값)
</script>
<script>
  // CSRF 메타태그에서 토큰/헤더명을 읽어 fetch 요청에 사용
  var csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
  var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

  (function initExisting() {
    if (existingSeatPrices && existingSeatPrices.length > 0) {
      existingSeatPrices.forEach(function (item) {
        savedPrices[item.gradeId] = item.price;
      });
      renderHiddenInputs();
      updateSummaryText();
    }
  })();

  document.getElementById('hallSelect').addEventListener('change', function () {
    var hallId = this.value;
    var btn = document.getElementById('openSeatPriceModalBtn');
    var summary = document.getElementById('seatPriceSummary');
    if (!hallId) {
      btn.disabled = true;
      summary.textContent = '공연장을 먼저 선택하세요.';
      savedPrices = {};
      renderHiddenInputs();
      return;
    }
    btn.disabled = false;
    summary.textContent = '좌석/가격 설정 버튼을 눌러 등급별 가격을 지정하세요.';
    // 홀이 바뀌면 기존 선택값 초기화
    savedPrices = {};
    renderHiddenInputs();
  });

  function openSeatPriceModal() {
    var hallId = document.getElementById('hallSelect').value;
    if (!hallId) return;

    Promise.all([
      fetch('/admin/performances/halls/' + hallId + '/grades').then(function (res) { return res.json(); }),
      fetch('/admin/performances/halls/' + hallId + '/seats').then(function (res) { return res.json(); })
    ]).then(function (results) {
      var grades = results[0];
      var seats = results[1];
      currentGrades = grades;

      renderGradeInputs(grades);
      renderSeatMap(seats);

      document.getElementById('seatPriceModal').style.display = 'flex';
    }).catch(function (err) {
      alert('좌석 정보를 불러오지 못했습니다.');
      console.error(err);
    });
  }

  function renderSeatMap(seats) {
    var container = document.getElementById('seatMapSections');
    var emptyEl = document.getElementById('seatMapEmpty');
    container.innerHTML = '';

    if (!seats || seats.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    // 구역(section) → 등급(grade) 순으로 묶기 (한 구역에 등급이 섞여 있을 수 있음)
    var bySection = {};
    seats.forEach(function (s) {
      var key = s.sectionName || '구역 미지정';
      if (!bySection[key]) bySection[key] = [];
      bySection[key].push(s);
    });

    Object.keys(bySection).forEach(function (sectionName) {
      var sectionSeats = bySection[sectionName];

      var byGrade = {};
      sectionSeats.forEach(function (s) {
        if (!byGrade[s.gradeId]) byGrade[s.gradeId] = { name: s.gradeName, color: s.displayColor, seats: [] };
        byGrade[s.gradeId].seats.push(s);
      });

      Object.keys(byGrade).forEach(function (gradeId) {
        var group = byGrade[gradeId];

        var titleRow = document.createElement('div');
        titleRow.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 8px;';

        var title = document.createElement('span');
        title.className = 'seat-map-section-title';
        title.style.cssText = 'font-weight:600;font-size:13px;';
        title.dataset.section = sectionName;
        title.dataset.mapTitleGrade = gradeId;
        title.textContent = sectionName + ' · ' + group.name;

        var priceLabel = document.createElement('span');
        priceLabel.className = 'seat-map-section-price';
        priceLabel.id = 'mapPrice_' + gradeId;
        priceLabel.textContent = '';

        titleRow.appendChild(title);
        titleRow.appendChild(priceLabel);
        container.appendChild(titleRow);

        var byRow = {};
        group.seats.forEach(function (s) {
          var rowKey = s.rowLabel || '';
          if (!byRow[rowKey]) byRow[rowKey] = [];
          byRow[rowKey].push(s);
        });

        Object.keys(byRow).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); })
                .forEach(function (rowKey) {
                  var rowDiv = document.createElement('div');
                  rowDiv.style.cssText = 'display:flex;justify-content:center;gap:4px;margin-bottom:4px;';
                  byRow[rowKey].forEach(function (s) {
                    var dot = document.createElement('span');
                    dot.title = sectionName + ' ' + s.rowLabel + '열 ' + s.seatNumber + '번 (' + s.gradeName + ')';
                    dot.style.cssText = 'display:inline-block;width:14px;height:14px;border-radius:3px;background:' + s.displayColor + ';';
                    rowDiv.appendChild(dot);
                  });
                  container.appendChild(rowDiv);
                });
      });
    });

    updateSeatMapPrices();
  }

  /** 등급별 가격 입력값을 좌석 배치도의 가격 라벨에 실시간으로 반영합니다. */
  function updateSeatMapPrices() {
    document.querySelectorAll('#seatGradeList input[data-grade-id]').forEach(function (input) {
      var label = document.getElementById('mapPrice_' + input.dataset.gradeId);
      if (!label) return;
      var val = input.value;
      label.textContent = val ? (Number(val).toLocaleString() + '원') : '';
    });
  }

  /** 등급명 입력값이 바뀔 때 좌석 배치도 타이틀에도 실시간으로 반영합니다. */
  function updateSeatMapTitles(gradeId, newName) {
    document.querySelectorAll('[data-map-title-grade="' + gradeId + '"]').forEach(function (el) {
      el.textContent = el.dataset.section + ' · ' + newName;
    });
  }

  function renderGradeInputs(grades) {
    var listEl = document.getElementById('seatGradeList');
    var emptyEl = document.getElementById('seatGradeEmpty');
    listEl.innerHTML = '';

    if (!grades || grades.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    grades.forEach(function (g) {
      var row = document.createElement('div');
      row.className = 'cluster grade-price-row';
      row.style.justifyContent = 'space-between';
      row.style.alignItems = 'center';

      var label = document.createElement('span');
      label.style.cssText = 'display:inline-flex;align-items:center;';

      var dot = document.createElement('span');
      dot.style.cssText = 'display:inline-block;width:12px;height:12px;border-radius:4px;background:' + g.displayColor + ';margin-right:8px;flex-shrink:0;';
      label.appendChild(dot);

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = g.name;
      nameInput.maxLength = 30;
      nameInput.dataset.gradeNameId = g.id;
      nameInput.dataset.originalName = g.name;
      nameInput.style.cssText = 'width:90px;font-weight:600;font-size:14px;border:1px solid #ddd;border-radius:4px;padding:4px 6px;margin-right:6px;';
      nameInput.oninput = function () {
        updateSeatMapTitles(g.id, nameInput.value || g.name);
      };
      label.appendChild(nameInput);

      var seatCountSpan = document.createElement('span');
      seatCountSpan.style.cssText = 'color:#999;font-size:12px;';
      seatCountSpan.textContent = '(' + g.seatCount + '석)';
      label.appendChild(seatCountSpan);

      var inputWrap = document.createElement('span');
      var priceInput = document.createElement('input');
      priceInput.type = 'number';
      priceInput.style.width = '150px';
      priceInput.placeholder = '가격 입력';
      priceInput.dataset.gradeId = g.id;
      priceInput.oninput = updateSeatMapPrices;
      if (savedPrices[g.id] != null) {
        priceInput.value = savedPrices[g.id];
      }
      inputWrap.appendChild(priceInput);
      inputWrap.appendChild(document.createTextNode(' 원'));

      row.appendChild(label);
      row.appendChild(inputWrap);
      listEl.appendChild(row);
    });
  }

  function closeSeatPriceModal() {
    document.getElementById('seatPriceModal').style.display = 'none';
  }

  function confirmSeatPrices() {
    var confirmBtn = document.getElementById('confirmSeatPricesBtn');
    var priceInputs = document.querySelectorAll('#seatGradeList input[data-grade-id]');
    var nameInputs = document.querySelectorAll('#seatGradeList input[data-grade-name-id]');

    savedPrices = {};
    priceInputs.forEach(function (input) {
      var price = input.value;
      if (price !== '' && price !== null) {
        savedPrices[input.dataset.gradeId] = parseInt(price, 10);
      }
    });

    var renamePromises = [];
    nameInputs.forEach(function (input) {
      var newName = input.value.trim();
      if (!newName) {
        input.value = input.dataset.originalName; // 빈 값은 무시하고 원래 이름으로 되돌림
        return;
      }
      if (newName !== input.dataset.originalName) {
        var gradeId = input.dataset.gradeNameId;
        var headers = {};
        headers[csrfHeader] = csrfToken;
        renamePromises.push(
                fetch('/admin/performances/grades/' + gradeId + '/rename?name=' + encodeURIComponent(newName), {
                  method: 'POST',
                  headers: headers
                }).then(function (res) {
                  if (!res.ok) throw new Error('rename failed: ' + gradeId);
                  input.dataset.originalName = newName;
                  var g = currentGrades.find(function (cg) { return String(cg.id) === String(gradeId); });
                  if (g) g.name = newName;
                })
        );
      }
    });

    confirmBtn.disabled = true;
    Promise.all(renamePromises).then(function () {
      renderHiddenInputs();
      updateSummaryText();
      closeSeatPriceModal();
    }).catch(function (err) {
      alert('등급명 저장 중 오류가 발생했습니다.');
      console.error(err);
    }).finally(function () {
      confirmBtn.disabled = false;
    });
  }

  function renderHiddenInputs() {
    var container = document.getElementById('seatPriceHiddenInputs');
    container.innerHTML = '';
    var idx = 0;
    for (var gradeId in savedPrices) {
      var gradeIdInput = document.createElement('input');
      gradeIdInput.type = 'hidden';
      gradeIdInput.name = 'seatPrices[' + idx + '].gradeId';
      gradeIdInput.value = gradeId;

      var priceInput = document.createElement('input');
      priceInput.type = 'hidden';
      priceInput.name = 'seatPrices[' + idx + '].price';
      priceInput.value = savedPrices[gradeId];

      container.appendChild(gradeIdInput);
      container.appendChild(priceInput);
      idx++;
    }
  }

  function updateSummaryText() {
    var count = Object.keys(savedPrices).length;
    var summary = document.getElementById('seatPriceSummary');
    summary.textContent = count > 0 ? ('등급 ' + count + '개 가격 설정됨') : '좌석/가격 설정 버튼을 눌러 등급별 가격을 지정하세요.';
  }

  // 수정 화면 초기 로드 시 홀이 이미 선택되어 있으면 버튼 활성화
  window.addEventListener('DOMContentLoaded', function () {
    var hallSelect = document.getElementById('hallSelect');
    var btn = document.getElementById('openSeatPriceModalBtn');
    if (hallSelect && btn && hallSelect.value) {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
