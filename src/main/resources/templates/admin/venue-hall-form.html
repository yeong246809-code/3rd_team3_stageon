
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 홀 추가</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/venue-seats.css}" href="/css/pages/venue-seats.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1>홀 추가</h1>
                    <p th:text="${venue.name} + '에 새 홀을 등록합니다.'">공연장에 새 홀을 등록합니다.</p>
                </div>
            </header>

            <section class="venue-form-card">
                <form th:action="@{/admin/venues/{venueId}/halls(venueId=${venue.id})}" th:object="${form}" method="post">
                    <div class="admin-form-grid">
                        <div>
                            <label>홀 이름<span class="required-mark">*</span></label>
                            <input type="text" th:field="*{name}" required>
                        </div>
                        <div>
                            <label>좌석 수<span class="required-mark">*</span></label>
                            <input type="number" min="0" th:field="*{seatCapacity}" required>
                        </div>
                        <div>
                            <label>접근성 좌석 수</label>
                            <input type="number" min="0" th:field="*{accessibleSeatCount}">
                        </div>
                        <div>
                            <label>KOPIS 홀 ID</label>
                            <input type="text" th:field="*{kopisHallId}">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn--venue-add" type="submit">저장</button>
                        <a class="btn--cancel" th:href="@{/admin/venues}">취소</a>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
