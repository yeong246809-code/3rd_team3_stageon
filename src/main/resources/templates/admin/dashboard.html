
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn Admin | 대시보드</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
  <script>
    var __t = localStorage.getItem('stageon-admin-theme');
    if (__t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</head>
<body>
<div class="admin-page">
  <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
  <main class="admin-main">
    <div th:replace="~{fragments/admin/admin-header :: header}"></div>
    <div class="admin-content">
      <header class="admin-title">
        <div>
          <h1>통합 대시보드</h1>
          <p>공연과 실시간 예매 운영 현황을 확인합니다.</p>
        </div>
        <a th:href="@{/admin/performances}" class="btn btn--dark">공연 등록</a>
      </header>
      <section class="stat-grid">
        <div class="card stat">
          <span>오늘 예매</span>
          <strong th:text="${stats.todayReservationCount()}">0</strong>
        </div>
        <div class="card stat">
          <span>대기 사용자</span>
          <strong th:text="${stats.waitingMemberCount()}">0</strong>
          <small class="badge badge--warning">WAITING</small>
        </div>
        <div class="card stat">
          <span>선점 좌석</span>
          <strong th:text="${stats.heldSeatCount()}">0</strong>
          <small class="badge badge--warning">HELD</small>
        </div>
        <div class="card stat">
          <span>결제 성공률</span>
          <strong th:text="${stats.paymentSuccessRate()} + '%'">0%</strong>
          <small class="badge badge--success">정상</small>
        </div>
      </section>
      <section class="admin-grid" style="margin-top:18px">
        <div class="card">
          <h2>실시간 운영 상태</h2>
          <div class="stack" style="margin-top:18px">
            <div class="cluster" style="justify-content:space-between">
              <span>Redis 대기열</span>
              <span class="badge badge--success">정상</span>
            </div>
            <div class="cluster" style="justify-content:space-between">
              <span>Ollama AI</span>
              <span class="badge"
                    th:classappend="${stats.ollamaConnected()} ? 'badge--success' : 'badge--danger'"
                    th:text="${stats.ollamaConnected()} ? '정상' : '연결 지연'">연결 지연</span>
            </div>
            <div class="cluster" style="justify-content:space-between">
              <span>KOPIS 동기화</span>
              <span class="badge badge--success">정상</span>
            </div>
          </div>
        </div>
        <div class="card">
          <h2>최근 예매</h2>
          <div class="table-wrap" style="margin-top:18px">
            <table class="table">
              <tbody>
              <tr th:if="${stats.recentReservations().isEmpty()}">
                <td colspan="3">최근 예매 내역이 없습니다.</td>
              </tr>
              <tr th:each="r : ${stats.recentReservations()}">
                <td th:text="${r.bookingNumber()}">STG-0000</td>
                <td th:text="${r.performanceTitle()}">공연명</td>
                <td>
                        <span class="badge"
                              th:classappend="${r.status() == 'RESERVED'} ? 'badge--success' : (${r.status() == 'PENDING'} ? 'badge--warning' : 'badge--danger')"
                              th:text="${r.status()}">RESERVED</span>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
