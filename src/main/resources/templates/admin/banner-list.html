
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 배너 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-banners.css}" href="/css/pages/admin-banners.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1>배너 관리</h1>
                    <p>메인 페이지 히어로 슬라이더에 노출되는 배너를 관리합니다.</p>
                </div>
                <div class="cluster">
                    <a class="btn btn--dark" th:href="@{/admin/banners/new}">배너 등록</a>
                </div>
            </header>

            <div class="alert alert--success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert--error" th:if="${error}" th:text="${error}"></div>

            <div class="card">
                <table class="admin-table banner-table">
                    <thead>
                    <tr>
                        <th>순서</th>
                        <th>썸네일</th>
                        <th>제목</th>
                        <th>연결 공연</th>
                        <th>기간</th>
                        <th>노출여부</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(banners)}">
                        <td colspan="7" class="empty-row">등록된 배너가 없습니다.</td>
                    </tr>
                    <tr th:each="banner : ${banners}">
                        <td class="order-cell">
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/move-up'}">
                                <button type="submit" class="btn--sm btn--order" th:disabled="${banner.first}">▲</button>
                            </form>
                            <span th:text="${banner.displayOrder} + 1">1</span>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/move-down'}">
                                <button type="submit" class="btn--sm btn--order" th:disabled="${banner.last}">▼</button>
                            </form>
                        </td>
                        <td><img class="banner-thumb" th:src="${banner.imageUrl}" alt="배너 썸네일"></td>
                        <td th:text="${banner.title}">배너 제목</td>
                        <td th:text="${banner.performanceTitle} ?: '-'">-</td>
                        <td>
              <span th:if="${banner.periodStartText != null or banner.periodEndText != null}"
                    th:text="${(banner.periodStartText ?: '') + ' ~ ' + (banner.periodEndText ?: '')}"></span>
                            <span th:unless="${banner.periodStartText != null or banner.periodEndText != null}">-</span>
                        </td>
                        <td>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/toggle'}">
                                <button type="submit" class="badge" th:classappend="${banner.active} ? ' badge--on' : ' badge--off'"
                                        th:text="${banner.active} ? '노출중' : '숨김'">노출중</button>
                            </form>
                        </td>
                        <td class="admin-table actions-cell">
                            <a class="btn--sm btn--edit" th:href="@{'/admin/banners/' + ${banner.id} + '/edit'}">수정</a>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/delete'}"
                                  onsubmit="return confirm('이 배너를 삭제하시겠습니까?');" style="display:inline;">
                                <button type="submit" class="btn--sm btn--delete">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
