
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 배너 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-banners.css}" href="/css/pages/admin-banners.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1>배너 관리</h1>
                    <p>메인 페이지 히어로 슬라이더에 노출되는 배너를 관리합니다.</p>
                </div>
                <div class="cluster">
                    <button type="button" class="btn" id="openSlideSettingBtn">배너 전환 속도 설정</button>
                    <a class="btn btn--dark" th:href="@{/admin/banners/new}">배너 등록</a>
                </div>
            </header>

            <div class="alert alert--success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert--error" th:if="${error}" th:text="${error}"></div>

            <div class="card">
                <table class="admin-table banner-table">
                    <thead>
                    <tr>
                        <th>순서</th>
                        <th>썸네일</th>
                        <th>제목</th>
                        <th>연결 공연</th>
                        <th>기간</th>
                        <th>노출여부</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(banners)}">
                        <td colspan="7" class="empty-row">등록된 배너가 없습니다.</td>
                    </tr>
                    <tr th:each="banner : ${banners}">
                        <td class="order-cell">
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/move-up'}">
                                <button type="submit" class="btn--sm btn--order" th:disabled="${banner.first}">▲</button>
                            </form>
                            <span th:text="${banner.displayOrder} + 1">1</span>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/move-down'}">
                                <button type="submit" class="btn--sm btn--order" th:disabled="${banner.last}">▼</button>
                            </form>
                        </td>
                        <td><img class="banner-thumb" th:src="${banner.imageUrl}" alt="배너 썸네일"></td>
                        <td th:text="${banner.title}">배너 제목</td>
                        <td th:text="${banner.performanceTitle} ?: '-'">-</td>
                        <td>
              <span th:if="${banner.periodStart != null or banner.periodEnd != null}"
                    th:text="${(banner.periodStart != null ? #temporals.format(banner.periodStart, 'yyyy.MM.dd') : '') + ' ~ ' + (banner.periodEnd != null ? #temporals.format(banner.periodEnd, 'yyyy.MM.dd') : '')}"></span>
                            <span th:unless="${banner.periodStart != null or banner.periodEnd != null}">-</span>
                        </td>
                        <td>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/toggle'}">
                                <button type="submit" class="badge" th:classappend="${banner.active} ? ' badge--on' : ' badge--off'"
                                        th:text="${banner.active} ? '노출중' : '숨김'">노출중</button>
                            </form>
                        </td>
                        <td class="admin-table actions-cell">
                            <a class="btn--sm btn--edit" th:href="@{'/admin/banners/' + ${banner.id} + '/edit'}">수정</a>
                            <form method="post" th:action="@{'/admin/banners/' + ${banner.id} + '/delete'}"
                                  onsubmit="return confirm('이 배너를 삭제하시겠습니까?');" style="display:inline;">
                                <button type="submit" class="btn--sm btn--delete">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- 배너 전환 속도 설정 모달 -->
<div class="modal-overlay" id="slideSettingModal" hidden>
    <div class="modal-box">
        <div class="modal-header">
            <h2>배너 전환 속도 설정</h2>
            <button type="button" class="modal-close" id="closeSlideSettingBtnX" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc">메인 페이지 히어로 배너가 자동으로 다음 슬라이드로<br>넘어가는 속도를 설정합니다.</p>
            <form method="post" th:action="@{/admin/banners/settings}">
                <div class="modal-field">
                    <label for="slideIntervalInput">자동 전환 간격</label>
                    <div class="modal-input-group">
                        <input class="input" id="slideIntervalInput" type="number" name="slideIntervalSeconds"
                               min="1" max="30" step="1" th:value="${slideIntervalSeconds}" required>
                        <span class="modal-input-unit">초</span>
                    </div>
                    <p class="modal-hint">1초 ~ 30초 사이로 설정할 수 있습니다. <span class="modal-hint-default">(기본값: 3초)</span></p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="closeSlideSettingBtn">취소</button>
                    <button type="submit" class="btn btn--dark">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/pages/admin-banner-list.js}" src="/js/pages/admin-banner-list.js"></script>
</body>
</html>
