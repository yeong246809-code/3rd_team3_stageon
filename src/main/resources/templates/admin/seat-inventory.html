
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn Admin | 좌석 재고·선점 현황</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
</head>
<body>
<div class="admin-page">
  <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
  <main class="admin-main">
    <div th:replace="~{fragments/admin/admin-header :: header}"></div>
    <div class="admin-content">
      <header class="admin-title">
        <div>
          <h1>좌석 재고·선점 현황</h1>
          <p>회차별 좌석 상태와 임시 선점 만료를 실시간 확인합니다.</p>
        </div>
        <button class="btn" type="button" onclick="location.reload()">새로고침</button>
      </header>

      <!-- 공연 · 회차 선택 -->
      <form class="cluster" method="get" th:action="@{/admin/seat-inventory}" style="margin-bottom:18px">
        <select class="select" name="performanceId" style="max-width:320px" onchange="this.form.submit()">
          <option th:each="p : ${performances}"
                  th:value="${p.id}"
                  th:text="${p.title}"
                  th:selected="${selectedPerformanceId != null and p.id.equals(selectedPerformanceId)}">공연명</option>
        </select>
        <select class="select" name="scheduleId" style="max-width:280px" onchange="this.form.submit()">
          <option th:if="${#lists.isEmpty(scheduleOptions)}" value="">등록된 회차가 없습니다</option>
          <option th:each="s : ${scheduleOptions}"
                  th:value="${s.id}"
                  th:text="${s.label}"
                  th:selected="${selectedScheduleId != null and s.id.equals(selectedScheduleId)}">08.16(토) 19:00 · 1회</option>
        </select>
        <noscript><button class="btn btn--dark" type="submit">조회</button></noscript>
      </form>

      <div th:if="${selectedScheduleId == null}" class="venue-empty" style="padding:60px 0">
        조회할 회차를 먼저 선택해주세요.
      </div>

      <div th:if="${selectedScheduleId != null}">
        <section class="stat-grid">
          <div class="card stat">
            <span>AVAILABLE</span>
            <strong th:text="${stats.available}">1,327</strong>
          </div>
          <div class="card stat">
            <span>HELD</span>
            <strong th:text="${stats.held}">136</strong>
          </div>
          <div class="card stat">
            <span>RESERVED</span>
            <strong th:text="${stats.reserved}">287</strong>
          </div>
          <div class="card stat">
            <span>BLOCKED</span>
            <strong th:text="${stats.blocked}">16</strong>
          </div>
        </section>

        <section class="admin-grid" style="margin-top:18px">
          <div class="card">
            <div class="cluster" style="justify-content:space-between">
              <h2>좌석 맵</h2>
              <div class="seat-legend">
                <span><i class="status-dot available"></i>AVAILABLE</span>
                <span><i class="status-dot held"></i>HELD</span>
                <span><i class="status-dot reserved"></i>RESERVED</span>
                <span><i class="status-dot blocked"></i>BLOCKED</span>
              </div>
            </div>

            <div th:if="${#lists.isEmpty(sections)}" class="venue-empty">좌석 데이터가 없습니다.</div>

            <div th:each="section : ${sections}">
              <h3 style="margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--muted)" th:text="${section.sectionName}">A구역</h3>
              <div class="inventory-map">
                <div class="seat-row" th:each="row : ${section.rows}">
                  <i class="seat"
                     th:each="seat : ${row.seats}"
                     th:classappend="${seat.status == 'HELD'} ? 'is-held' : (${seat.status == 'RESERVED'} ? 'is-selected' : (${seat.status == 'BLOCKED'} ? 'is-disabled' : ''))"
                     th:attr="title=${seat.gradeName} + ' ' + ${row.rowLabel} + '-' + ${seat.seatNumber} + ' · ' + ${seat.statusText} + ' · ' + ${seat.price} + '원'"></i>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <h2>활성 선점</h2>
            <div class="table-wrap" style="margin-top:18px">
              <table class="table">
                <thead>
                <tr>
                  <th>선점 번호</th>
                  <th>사용자</th>
                  <th>좌석 수</th>
                  <th>만료까지</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(activeHolds)}">
                  <td colspan="4" class="venue-empty">활성 선점이 없습니다.</td>
                </tr>
                <tr th:each="hold : ${activeHolds}">
                  <td th:text="'#' + ${hold.holdId}">#1021</td>
                  <td th:text="${hold.memberLabel}">member***</td>
                  <td th:text="${hold.seatCount} + '석'">2석</td>
                  <td>
                    <span class="badge badge--warning hold-countdown" th:attr="data-expires-at=${hold.expiresAtIso}">--:--</span>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
  (function () {
    function formatRemaining(ms) {
      if (ms <= 0) return '만료';
      var totalSec = Math.floor(ms / 1000);
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function tick() {
      document.querySelectorAll('.hold-countdown').forEach(function (el) {
        var expiresAt = new Date(el.getAttribute('data-expires-at'));
        var remaining = expiresAt.getTime() - Date.now();
        el.textContent = formatRemaining(remaining);
      });
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
