
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 배너 전환 속도 설정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-banners.css}" href="/css/pages/admin-banners.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1>배너 전환 속도 설정</h1>
                    <p>메인 페이지 히어로 배너가 자동으로 다음 슬라이드로 넘어가는 속도를 설정합니다.</p>
                </div>
                <div class="cluster">
                    <a class="btn" th:href="@{/admin/banners}">목록으로</a>
                    <button class="btn btn--dark" type="submit" form="bannerSettingsForm">저장</button>
                </div>
            </header>

            <div class="alert alert--success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert--error" th:if="${error}" th:text="${error}"></div>

            <form id="bannerSettingsForm" class="card stack" method="post" th:action="@{/admin/banners/settings}">
                <div class="field" style="max-width:320px;">
                    <label>자동 전환 간격(초)</label>
                    <input class="input" type="number" name="slideIntervalSeconds" min="1" max="30" step="1"
                           th:value="${slideIntervalSeconds}" required>
                    <p class="field-hint">1초 ~ 30초 사이로 설정할 수 있습니다. (기본값: 3초)</p>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
