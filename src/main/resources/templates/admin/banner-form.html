
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn Admin | 배너 등록·수정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-pages.css}" href="/css/pages/admin-pages.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-banners.css}" href="/css/pages/admin-banners.css">
</head>
<body>
<div class="admin-page">
    <div th:replace="~{fragments/admin/admin-sidebar :: sidebar}"></div>
    <main class="admin-main">
        <div th:replace="~{fragments/admin/admin-header :: header}"></div>
        <div class="admin-content">
            <header class="admin-title">
                <div>
                    <h1 th:text="${form.id} != null ? '배너 수정' : '배너 등록'">배너 등록·수정</h1>
                    <p>메인 페이지 히어로 슬라이더 배너 정보를 관리합니다.</p>
                </div>
                <div class="cluster">
                    <a class="btn" th:href="@{/admin/banners}">목록으로</a>
                    <button class="btn btn--dark" type="submit" form="bannerForm">저장</button>
                </div>
            </header>

            <form id="bannerForm" class="card stack" method="post" enctype="multipart/form-data"
                  th:object="${form}"
                  th:action="${form.id} != null ? @{'/admin/banners/' + ${form.id}} : @{/admin/banners}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <h2>배너 이미지</h2>
                <p class="field-hint">
                    히어로 영역은 <b>가로로 넓은 와이드 이미지</b>(권장 1920×800px, 최소 1600×640px)입니다.
                    세로 포스터를 그대로 올리면 좌우가 크게 잘리고 화질도 흐려집니다.
                    포토샵 등에서 포스터 속 인물이 중앙에 오도록 <b>와이드 비율로 새로 크롭</b>한 이미지를 올려주세요.
                </p>
                <div class="poster-upload">
                    <img class="poster-preview poster-preview--wide" id="bannerPreview"
                         th:src="${form.imageUrl} ?: '#'"
                         th:if="${form.imageUrl}" alt="배너 미리보기"
                         onerror="this.style.display='none'; document.getElementById('bannerPreviewEmpty').style.display='flex';">
                    <div class="poster-preview poster-preview--wide poster-preview--empty" id="bannerPreviewEmpty"
                         th:style="${form.imageUrl} ? 'display:none' : 'display:flex'">
                        이미지 없음
                    </div>
                    <div class="field">
                        <label>배너 이미지 업로드</label>
                        <input class="input file-input" type="file" name="bannerFile" accept="image/*" onchange="previewBanner(this)">
                    </div>
                </div>

                <div class="section-heading">
                    <h2>기본 정보</h2>
                    <span class="required-guide"><span class="required-mark">*</span> 표시는 필수 항목입니다.</span>
                </div>
                <div class="admin-form-grid">
                    <div class="field">
                        <label><span class="required-mark">*</span> 제목</label>
                        <input class="input" type="text" th:field="*{title}" required>
                    </div>
                    <div class="field">
                        <label>연결 공연</label>
                        <select class="input" th:field="*{performanceId}">
                            <option value="">선택 안함(커스텀 링크 사용)</option>
                            <option th:each="p : ${performances}" th:value="${p.id}" th:text="${p.title}"></option>
                        </select>
                    </div>
                    <div class="field field--full">
                        <label>서브 문구</label>
                        <textarea class="input" rows="2" th:field="*{description}"></textarea>
                    </div>
                    <div class="field">
                        <label>기간 시작일</label>
                        <input class="input" type="date" th:field="*{periodStart}">
                    </div>
                    <div class="field">
                        <label>기간 종료일</label>
                        <input class="input" type="date" th:field="*{periodEnd}">
                    </div>
                    <div class="field">
                        <label>상단 뱃지 문구</label>
                        <input class="input" type="text" placeholder="예: NOW ON SALE" th:field="*{badgeText}">
                    </div>
                    <div class="field">
                        <label>노출 여부</label>
                        <label class="switch">
                            <input type="checkbox" th:field="*{active}">
                            <span>노출함</span>
                        </label>
                    </div>
                </div>

                <div class="section-heading">
                    <h2>버튼 설정</h2>
                </div>
                <div class="admin-form-grid">
                    <div class="field">
                        <label>주 버튼 문구</label>
                        <input class="input" type="text" placeholder="실시간 예매하기" th:field="*{button1Text}">
                    </div>
                    <div class="field">
                        <label>주 버튼 이동 위치</label>
                        <select class="input" th:field="*{button1LinkType}" onchange="toggleCustomUrl('button1')">
                            <option value="AUTO">연결 공연 예매 페이지(자동)</option>
                            <option value="PERFORMANCES">전체 공연 목록</option>
                            <option value="GENRE_MUSICAL">뮤지컬</option>
                            <option value="GENRE_PLAY">연극</option>
                            <option value="GENRE_CONCERT">콘서트</option>
                            <option value="GENRE_CLASSIC">클래식/무용</option>
                            <option value="GENRE_EXHIBITION">전시/행사</option>
                            <option value="AI_RECOMMEND">AI 맞춤 추천</option>
                            <option value="CUSTOMER_CENTER">고객센터</option>
                            <option value="CUSTOM">직접 입력(URL)</option>
                        </select>
                        <input class="input" type="text" id="button1UrlInput" placeholder="https://..." th:field="*{button1Url}"
                               style="margin-top:8px;">
                    </div>
                    <div class="field">
                        <label>보조 버튼 문구</label>
                        <input class="input" type="text" placeholder="자세히 보기" th:field="*{button2Text}">
                    </div>
                    <div class="field">
                        <label>보조 버튼 이동 위치</label>
                        <select class="input" th:field="*{button2LinkType}" onchange="toggleCustomUrl('button2')">
                            <option value="AUTO">연결 공연 상세 페이지(자동)</option>
                            <option value="PERFORMANCES">전체 공연 목록</option>
                            <option value="GENRE_MUSICAL">뮤지컬</option>
                            <option value="GENRE_PLAY">연극</option>
                            <option value="GENRE_CONCERT">콘서트</option>
                            <option value="GENRE_CLASSIC">클래식/무용</option>
                            <option value="GENRE_EXHIBITION">전시/행사</option>
                            <option value="AI_RECOMMEND">AI 맞춤 추천</option>
                            <option value="CUSTOMER_CENTER">고객센터</option>
                            <option value="CUSTOM">직접 입력(URL)</option>
                        </select>
                        <input class="input" type="text" id="button2UrlInput" placeholder="https://..." th:field="*{button2Url}"
                               style="margin-top:8px;">
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/pages/admin-banner-form.js}" src="/js/pages/admin-banner-form.js"></script>
</body>
</html>
