<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 실시간 스캐너</title>
    <!-- 카메라 스캔 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #000; }
        #message-area { margin-top: 15px; font-size: 18px; font-weight: bold; padding: 15px; border-radius: 8px; }

        /* 예매 정보 표시 영역 */
        #ticket-info-area { display: none; max-width: 400px; margin: 20px auto; background: #333; padding: 20px; border-radius: 8px; text-align: left; }
        #ticket-info-area h3 { margin: 0 0 10px 0; color: #4dabf7; }
        #ticket-info-area p { margin: 5px 0; font-size: 16px; }

        /* 입장 완료 버튼 */
        #btn-enter { width: 100%; padding: 15px; margin-top: 15px; background: #2f9e44; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        #btn-enter:hover { background: #2b8a3e; }
        #btn-cancel { width: 100%; padding: 10px; margin-top: 10px; background: #495057; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }

        .success { background: #1864ab; }
        .fail { background: #e03131; }
    </style>
</head>
<body>
<h1>실시간 티켓 검표</h1>

<!-- 카메라 영역 -->
<div id="reader"></div>
<div id="message-area">QR 코드를 네모 칸 안에 비춰주세요.</div>

<!-- 🚨 티켓 정보 및 입장 처리 영역 (평소엔 숨겨져 있음) -->
<div id="ticket-info-area">
    <h3 id="info-title">공연명</h3>
    <p id="info-time">일시: <span></span></p>
    <p id="info-seat">좌석: <span></span></p>

    <button id="btn-enter" data-seat-id="">입장 완료 처리</button>
    <button id="btn-cancel">취소하고 다시 스캔</button>
</div>

<script>
    const messageArea = document.getElementById('message-area');
    const infoArea = document.getElementById('ticket-info-area');
    const btnEnter = document.getElementById('btn-enter');
    const btnCancel = document.getElementById('btn-cancel');

    let isScanning = false;
    const html5QrCode = new Html5Qrcode("reader");

    // 1. QR 스캔 성공 시 실행 (검증 API 호출)
    function onScanSuccess(decodedText) {
        if (isScanning || !decodedText.startsWith("STAGEON:DYNAMIC:")) return;
        isScanning = true; // 중복 스캔 방지 락 걸기

        messageArea.textContent = "QR 검증 중...";
        messageArea.className = "";

        // 방금 백엔드에 만드신 /api/tickets/validate 호출
        fetch(`/api/tickets/validate?token=${encodeURIComponent(decodedText)}`)
            .then(res => {
                if (!res.ok) throw new Error("유효하지 않거나 만료된 QR입니다.");
                return res.json(); // 백엔드에서 MyTicketResponse를 JSON으로 줌
            })
            .then(data => {
                // 성공: 화면에 예매 정보 뿌리기
                messageArea.textContent = "✅ 확인 완료! 입장 처리 버튼을 눌러주세요.";
                messageArea.className = "success";

                document.getElementById('info-title').textContent = data.performanceTitle;
                document.getElementById('info-time').querySelector('span').textContent = data.startsAt.replace('T', ' ').substring(0, 16);
                document.getElementById('info-seat').querySelector('span').textContent =
                    `${data.gradeName} · ${data.sectionName} ${data.rowLabel}열 ${data.seatNumber}번`;

                // 입장 버튼에 seatId 몰래 숨겨두기
                btnEnter.dataset.seatId = data.reservationSeatId;

                // 정보 영역 짠! 하고 보여주기
                infoArea.style.display = "block";
            })
            .catch(err => {
                messageArea.textContent = err.message;
                messageArea.className = "fail";
                setTimeout(() => { isScanning = false; }, 2000); // 에러나면 2초 뒤 다시 스캔 가능
            });
    }

    // 2. 직원이 [입장 완료 처리] 버튼 클릭 시 실행 (입장 API 호출)
    btnEnter.addEventListener('click', () => {
        const seatId = btnEnter.dataset.seatId;
        btnEnter.disabled = true;
        btnEnter.textContent = "처리 중...";

        // 방금 백엔드에 만드신 /api/tickets/{seatId}/enter 호출
        fetch(`/api/tickets/${seatId}/enter`, { method: 'POST' })
            .then(res => {
                if (res.ok) {
                    alert("🎉 정상적으로 입장 처리되었습니다!");
                    resetScanner(); // 화면 초기화하고 다음 사람 받을 준비
                } else {
                    alert("입장 처리에 실패했습니다. 이미 처리된 티켓인지 확인하세요.");
                    resetScanner();
                }
            })
            .catch(err => alert("서버 통신 오류가 발생했습니다."));
    });

    // 3. 직원이 [취소] 버튼 클릭 시 (잘못 찍었을 때)
    btnCancel.addEventListener('click', () => {
        resetScanner();
    });

    // 스캐너 화면 초기화 함수
    function resetScanner() {
        infoArea.style.display = "none";
        messageArea.className = "";
        messageArea.textContent = "다음 QR 코드를 스캔해주세요.";
        btnEnter.disabled = false;
        btnEnter.textContent = "입장 완료 처리";

        // 1.5초 정도 여유를 주고 스캐너 락 풀기
        setTimeout(() => { isScanning = false; }, 1500);
    }

    // 카메라 실행
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            messageArea.textContent = "카메라 권한을 허용해주세요.";
        });
</script>
</body>
</html>
