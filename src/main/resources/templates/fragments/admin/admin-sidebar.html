



<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 관리자 기능 전체를 연결하는 공통 사이드바 -->
<aside th:fragment="sidebar" class="admin-sidebar" style="position:relative;">
  <a class="admin-brand" th:href="@{/admin/dashboard}" href="/admin/dashboard">StageOn<small>ADMIN CONSOLE</small></a>
  <nav class="admin-nav" aria-label="관리자 메뉴">
    <a th:href="@{/admin/dashboard}" href="/admin/dashboard"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/dashboard')} ? 'is-active'">▦<span>통합 대시보드</span></a>
    <a th:href="@{/admin/performances}" href="/admin/performances"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/performances')} ? 'is-active'">◫<span>공연 등록·수정</span></a>
    <a th:href="@{/admin/venues}" href="/admin/venues"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/venues')} ? 'is-active'">⌂<span>공연장·좌석 관리</span></a>
    <a th:href="@{/admin/schedules}" href="/admin/schedules"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/schedules')} ? 'is-active'">◷<span>일정·회차 관리</span></a>
    <a th:href="@{/admin/seat-inventory}" href="/admin/seat-inventory"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/seat-inventory')} ? 'is-active'">▥<span>좌석 재고·선점 현황</span></a>
    <a th:href="@{/admin/orders}" href="/admin/orders"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/orders')} ? 'is-active'">◎<span>예매·주문 조회</span></a>
    <a th:href="@{/admin/members}" href="/admin/members"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/members')} ? 'is-active'">☺<span>회원 관리</span></a>
    <a th:href="@{/admin/banners}" href="/admin/banners"
       th:classappend="${currentUri != null and currentUri.startsWith('/admin/banners')} ? 'is-active'">▤<span>배너 관리</span></a>
  </nav>

  <div class="admin-profile">
    <span class="admin-profile__avatar" th:text="${admin != null ? #strings.substring(admin.name, 0, 1) : '관'}">관</span>
    <div class="admin-profile__info">
      <strong th:text="${admin != null ? admin.name : '슈퍼 관리자'}">슈퍼 관리자</strong>
      <span th:text="${admin != null ? admin.role : 'Super Admin'}">Super Admin</span>
    </div>
  </div>
</aside>
</body>
</html>
