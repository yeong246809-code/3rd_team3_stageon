<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
  <div class="utility">
    <div class="shell">
      <span><b>StageOn</b> · AI 기반 실시간 공연 예매 플랫폼</span>
      <div class="utility-menu"><span>로그인</span><span>회원가입</span><span>마이페이지</span><span>고객센터</span></div>
    </div>
  </div>
  <div class="main-header">
    <div class="shell">
      <div class="brand-wrap">
        <div class="brand">StageOn<small>AI로 더 빠르고, 스마트하게</small></div>
        <nav class="main-nav" aria-label="주요 메뉴"><span>공연/전시</span><span>스포츠</span></nav>
      </div>
      <div class="search" role="search">
        <input type="search" aria-label="통합 검색" placeholder="공연명, 아티스트, 장소, 날짜 검색">
        <span aria-hidden="true">⌕</span>
      </div>
    </div>
  </div>
  <nav class="subnav" aria-label="공연 장르">
    <div class="shell"><span>뮤지컬</span><span>연극</span><span>콘서트</span><span>클래식/무용</span><span>전시/행사</span><span>AI 맞춤 추천</span><span>고객센터</span></div>
  </nav>
</header>
</body>
</html>
