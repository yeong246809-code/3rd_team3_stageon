<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 예매 정보 패널 (좌석 선택 & 주문 확인 공용) -->
<aside class="card booking-summary" th:fragment="summary">
  <span class="eyebrow">BOOKING SUMMARY</span>
  <h2 style="margin-top:8px">예매 정보</h2>
  <dl>
    <div>
      <dt>공연</dt>
      <dd th:text="${performanceTitle ?: '불러오기 실패'}">오페라의 유령</dd>
    </div>
    <div>
      <dt>일시</dt>
      <dd th:text="${scheduleTime != null ? #temporals.format(scheduleTime, 'yyyy.MM.dd HH:mm') : '불러오기 실패'}">2026.08.15 19:00</dd>
    </div>

    <!-- 1. 주문 확인 페이지(STEP 3): 서버에서 holdItems를 넘겨준 경우 -->
    <div th:if="${holdItems != null}" style="display: contents;">
      <div>
        <dt>좌석</dt>
        <dd>
          <span th:if="${#lists.isEmpty(holdItems)}" style="color: #ff5252;">좌석을 선택해주세요</span>
          <span th:unless="${#lists.isEmpty(holdItems)}"
                th:text="${#strings.listJoin(holdItems.![scheduleSeat.seat.sectionName + ' ' + scheduleSeat.seat.rowLabel + '열 ' + scheduleSeat.seat.seatNumber + '번'], ', ')}">
              R구역 1열 5번
            </span>
        </dd>
      </div>
      <div>
        <dt>매수</dt>
        <dd th:text="${totalCount != null ? totalCount + '매' : '0매'}">1매</dd>
      </div>
      <div>
        <dt>결제 금액</dt>
        <dd th:text="${totalPrice != null ? #numbers.formatInteger(totalPrice, 3, 'COMMA') + '원' : '0원'}" style="font-weight: bold; color: #ff5252;">0원</dd>
      </div>
    </div>

    <!-- 2. 좌석 선택 페이지(STEP 2): holdItems가 없고 JS가 동적으로 채워야 하는 경우 -->
    <div th:unless="${holdItems != null}" style="display: contents;">
      <div id="dynamic-seat-container" style="display: contents;">
        <div>
          <dt>좌석</dt>
          <dd style="color: #ff5252;">좌석을 선택해주세요</dd>
        </div>
      </div>
      <div>
        <dt>매수</dt>
        <dd id="summary-seat-count">0매</dd>
      </div>
      <div>
        <dt>결제 금액</dt>
        <dd id="summary-seat-price" style="font-weight: bold;">0원</dd>
      </div>
    </div>

  </dl>
</aside>
</body>
</html>
