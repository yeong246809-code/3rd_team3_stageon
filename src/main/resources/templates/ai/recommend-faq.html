<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>StageOn | AI 추천·FAQ</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/public-pages.css}" href="/css/pages/public-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/common/site-header :: header}"></div>
    <main class="page page--soft">
      <div class="shell">
        <!-- AI 장애가 일반 검색·예매 흐름에 영향을 주지 않는 독립 화면 -->
        <header class="page-heading">
          <span class="eyebrow">STAGEON AI</span>
          <h1>공연 추천 · FAQ</h1>
          <p>자연어로 취향을 말하면 조건을 정리하고 공연을 추천합니다.</p>
        </header>
        <div class="notice notice--ai" style="margin-bottom:20px">
          <b>AI 사용 원칙</b>
          · 좌석 수, 가격, 결제 상태, 대기 순번은 AI가 만들지 않으며 Spring Boot의 실제 데이터만 설명합니다.
        </div>
        <div class="ai-grid">
          <aside class="card">
            <h2>빠른 질문</h2>
            <div class="stack ai-quick-questions" style="margin-top:18px">
              <button class="btn ai-quick-question" type="button" data-ai-question="이번 주말 서울에서 볼 만한 뮤지컬을 추천해 줘.">이번 주말 서울 뮤지컬</button>
              <button class="btn ai-quick-question" type="button" data-ai-question="부모님과 함께 볼 만한 클래식 공연을 추천해 줘.">부모님과 볼 클래식</button>
              <button class="btn ai-quick-question" type="button" data-ai-question="아이와 함께 볼 수 있는 공연을 알려 줘.">아이와 함께 볼 공연</button>
            </div>
            <div class="notice notice--danger" style="margin-top:24px">
              <b>AI 서버 연결 지연</b>
              <br>
              Ollama가 중단되어도 검색과 일반 예매는 정상 이용할 수 있습니다.
            </div>
          </aside>
          <section class="card chat-window" aria-label="StageOn AI 채팅">
            <div id="ai-messages" class="messages" aria-live="polite">
              <div class="message">
                <b>StageOn AI입니다.</b>
                <br>
                지역, 날짜, 장르를 포함해 공연을 물어보세요. KOPIS의 공연 정보를 확인해 답변합니다.
              </div>
            </div>
            <p id="ai-chat-status" class="ai-chat-status" role="status"></p>
            <form id="ai-chat-form" class="chat-compose">
              <label class="sr-only" for="ai-question">질문</label>
              <input id="ai-question" class="input" maxlength="500" autocomplete="off"
                     placeholder="예: 이번 주말 서울 뮤지컬 추천해 줘" required>
              <button id="ai-send-button" class="btn btn--primary" type="submit">전송</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/common/site-footer :: footer}"></div>
    <div th:replace="~{fragments/common/floating-actions :: floatingActions}"></div>
    <script th:src="@{/js/pages/ai-chat.js}" src="/js/pages/ai-chat.js" defer></script>
  </body>
</html>
