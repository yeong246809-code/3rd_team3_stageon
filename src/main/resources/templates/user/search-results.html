<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 공연 찾기</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/public-pages.css}" href="/css/pages/public-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/common/site-header :: header}"></div>
    <main class="page">
      <div class="shell">
        <header class="page-heading">
          <span class="eyebrow">PERFORMANCES</span>
          <h1 th:if="${!#strings.isEmpty(keyword)}" th:text="${'‘' + keyword + '’ 검색 결과'}">검색 결과</h1>
          <h1 th:if="${#strings.isEmpty(keyword) and !#strings.isEmpty(selectedGenre)}"
              th:text="${selectedGenre == '행사' ? '전시·행사 공연' : selectedGenre + ' 공연'}">장르 공연</h1>
          <h1 th:if="${#strings.isEmpty(keyword) and #strings.isEmpty(selectedGenre)}">전체 공연</h1>
          <p>현재 공개되어 있고 예매 예정 또는 예매 중인 공연입니다.</p>
        </header>

        <div class="search-toolbar">
          <nav class="tabs performance-tabs" aria-label="공연 장르">
            <a class="tab"
               th:classappend="${#strings.isEmpty(selectedGenre)} ? ' is-active'"
               th:attr="aria-current=${#strings.isEmpty(selectedGenre) ? 'page' : null}"
               th:href="@{/performances(keyword=${keyword})}"
               href="/performances">전체</a>
            <a class="tab"
               th:each="option : ${genreOptions}"
               th:classappend="${selectedGenre == option.value} ? ' is-active'"
               th:attr="aria-current=${selectedGenre == option.value ? 'page' : null}"
               th:href="@{/performances(keyword=${keyword},genre=${option.value})}"
               th:text="${option.label}"
               href="/performances">뮤지컬</a>
          </nav>
          <span class="result-count" th:text="${performances.size() + '개 공연'}">0개 공연</span>
        </div>

        <div class="performance-list-grid" th:if="${!performances.isEmpty()}">
          <a class="performance-list-card"
             th:each="performance : ${performances}"
             th:href="@{/performances/{id}(id=${performance.id})}"
             href="/performances">
            <img th:src="${#strings.isEmpty(performance.posterUrl) ? performance.fallbackPosterUrl : performance.posterUrl}"
                 src="/images/posters/default-performance.webp"
                 th:attr="data-poster-fallback=${performance.fallbackPosterUrl}"
                 th:alt="${#strings.isEmpty(performance.posterUrl) ? '' : performance.title + ' 포스터'}"
                 loading="lazy"
                 decoding="async"
                 alt="">
            <div class="performance-list-card__body">
              <span class="performance-status"
                    th:classappend="${performance.status == 'ON_SALE'} ? ' is-on-sale'"
                    th:text="${performance.status == 'ON_SALE' ? '예매 가능' : '오픈 예정'}">예매 가능</span>
              <h2 th:text="${performance.title}">공연 제목</h2>
              <p th:text="${performance.genre}">장르</p>
              <time th:text="${#temporals.format(performance.startDate, 'yyyy.MM.dd') + ' ~ ' + #temporals.format(performance.endDate, 'yyyy.MM.dd')}">공연 기간</time>
            </div>
          </a>
        </div>

        <section class="performance-empty" th:if="${performances.isEmpty()}">
          <strong>현재 조건에 맞는 판매 중 공연이 없습니다.</strong>
          <p>다른 장르를 선택하거나 전체 공연을 확인해 주세요.</p>
          <a class="btn btn--dark" th:href="@{/performances}" href="/performances">전체 공연 보기</a>
        </section>
      </div>
    </main>
    <div th:replace="~{fragments/common/site-footer :: footer}"></div>
    <div th:replace="~{fragments/common/floating-actions :: floatingActions}"></div>
    <script defer th:src="@{/js/poster-fallback.js}" src="/js/poster-fallback.js"></script>
  </body>
</html>
