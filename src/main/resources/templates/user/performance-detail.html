<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 공연 상세</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/public-pages.css}" href="/css/pages/public-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/common/site-header :: header}"></div>
    <main class="page">
      <div class="shell">
        <!-- 공연 기본 정보와 예매 진입 영역 -->
        <header class="page-heading">
          <span class="eyebrow">뮤지컬 · 서울</span>
          <h1>뮤지컬 〈오페라의 유령〉</h1>
          <p>The Phantom of the Opera</p>
        </header>
        <section class="detail-hero">
          <img class="detail-poster" th:src="@{/images/figma/detail-04.jpg}" src="/images/figma/detail-04.jpg" alt="오페라의 유령 공연 포스터">
          <div class="card">
            <h2>관람 정보</h2>
            <dl class="info-list" style="margin-top:22px">
              <div>
                <dt>공연 기간</dt>
                <dd>2026.07.18 ~ 2026.10.11</dd>
              </div>
              <div>
                <dt>공연 시간</dt>
                <dd>화·목 19:30 / 토 14:00, 19:00</dd>
              </div>
              <div>
                <dt>공연장</dt>
                <dd>블루스퀘어 신한카드홀</dd>
              </div>
              <div>
                <dt>관람 등급</dt>
                <dd>만 7세 이상</dd>
              </div>
              <div>
                <dt>가격</dt>
                <dd>VIP 160,000 · R 130,000 · S 100,000원</dd>
              </div>
            </dl>
          </div>
          <aside class="card card--shadow">
            <h2>예매하기</h2>
            <div class="field" style="margin-top:18px">
              <label>날짜</label>
              <select class="select">
                <option>2026.08.15 (토)</option>
              </select>
            </div>
            <div class="field" style="margin-top:14px">
              <label>회차</label>
              <button class="btn" type="button">2회 19:00</button>
            </div>
            <div class="notice" style="margin:16px 0">잔여석 VIP 42 · R 81 · S 96</div>
            <a class="btn btn--primary btn--wide" th:href="@{/schedule-select}" href="/schedule-select">날짜·회차 선택</a>
          </aside>
        </section>
        <section style="padding-top:70px">
          <h2 class="section-title">공연 소개</h2>
          <p class="section-copy">파리 오페라 하우스를 배경으로 한 사랑과 비극의 이야기를 압도적인 무대와 오케스트라로 만나보세요.</p>
        </section>
      </div>
    </main>
    <div th:replace="~{fragments/common/site-footer :: footer}"></div>
    <div th:replace="~{fragments/common/floating-actions :: floatingActions}"></div>
  </body>
</html>
