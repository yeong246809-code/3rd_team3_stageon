<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn | 결제 진행</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">

  <!-- 토스 페이먼츠 -->
  <script src="https://js.tosspayments.com/v1/payment"></script>

</head>
<body id="top">
<div th:replace="~{fragments/booking/booking-header :: bookingHeader(4)}"></div>

<main class="booking-page">
  <div class="shell booking-grid">

    <section class="stack">
      <header class="page-heading">
        <span class="eyebrow">STEP 04 · PAYMENT</span>
        <h1>결제를 진행해 주세요</h1>
        <p>안전한 결제를 위해 포트원(PortOne) 결제 시스템을 사용합니다.</p>
      </header>

      <div class="card" style="margin-top:20px;">
        <h2>주문 및 예매자 정보</h2>
        <div style="margin-top:18px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
          <p style="margin-bottom: 8px;"><strong>이름:</strong> <span th:text="${paymentRequest.bookerName}">테스터</span></p>
          <p style="margin-bottom: 8px;"><strong>이메일:</strong> <span th:text="${paymentRequest.bookerEmail}">tester@example.com</span></p>
          <p style="margin-bottom: 8px;"><strong>연락처:</strong> <span th:text="${paymentRequest.bookerPhone}">010-1234-5678</span></p>
          <p style="margin-bottom: 8px;"><strong>수령 방법:</strong> <span th:text="${paymentRequest.receiveMethod.name() == 'MOBILE' ? '모바일 티켓' : '현장 수령'}">모바일 티켓</span></p>
          <p><strong>결제 예정 금액:</strong> <span th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'" style="color: #f03e3e; font-weight: bold;">162,000원</span></p>
        </div>
      </div>

      <div class="notice notice--ai" style="margin-top:20px;">
        <b>테스트 결제 안내</b>
        · 현재 환경은 테스트 모드입니다. 실제 과금이 발생하지 않는 테스트용 카드를 사용해 주세요.
      </div>
    </section>

    <aside class="stack">
      <div th:replace="~{fragments/booking/booking-summary :: summary}"></div>

      <!-- 결제 성공 시 결과를 백엔드로 넘길 Hidden Form -->
      <form id="completePaymentForm" th:action="@{/payment/complete}" method="post" style="display: none;">
        <input type="hidden" name="impUid" id="inputImpUid"> <!-- V1에서는 imp_uid를 사용합니다 -->
        <input type="hidden" name="merchantUid" id="inputMerchantUid">
        <input type="hidden" name="seatHoldId" th:value="${paymentRequest.seatHoldId}">
        <input type="hidden" name="holdTokenHash" th:value="${paymentRequest.holdTokenHash}">

        <input type="hidden" name="bookerName" th:value="${paymentRequest.bookerName}">
        <input type="hidden" name="bookerEmail" th:value="${paymentRequest.bookerEmail}">
        <input type="hidden" name="bookerPhone" th:value="${paymentRequest.bookerPhone}">
        <input type="hidden" name="receiveMethod" th:value="${paymentRequest.receiveMethod}">
      </form>

      <button type="button" class="btn btn--primary btn--wide" onclick="requestPayment()">
        <span th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'">162,000원</span> 결제하기
      </button>

      <div style="margin-top: 15px; text-align: center;">
        <button type="button" class="btn btn--secondary btn--wide" onclick="cancelPayment()" style="background-color: #f8f9fa; color: #495057; border: 1px solid #ced4da;">결제 취소 (좌석 해제)</button>
      </div>
    </aside>
  </div>
</main>

<script th:inline="javascript">
  // 1. 토스페이먼츠 객체 초기화 (발급받은 테스트 클라이언트 키)
  // 함수 밖에서 미리 초기화해두는 것이 좋습니다.
  const tossPayments = TossPayments("test_ck_ORzdMaqN3wnw4wQk6KJB85AkYXQG");

  function requestPayment() {
    // 2. Thymeleaf를 통해 서버(Model)에서 넘어온 실제 데이터를 JS 변수에 할당합니다.
    const amount = /*[[${totalAmount}]]*/ 162000;
    const orderName = /*[[${performanceTitle ?: 'StageOn 티켓 예매'}]]*/ 'StageOn 티켓 예매';
    const customerName = /*[[${paymentRequest.bookerName}]]*/ '테스터';
    const customerEmail = /*[[${paymentRequest.bookerEmail}]]*/ 'tester@example.com';

    // 백엔드 컨트롤러(Model)에서 반드시 생성해서 넘겨주어야 하는 결제 고유 번호(멱등키)입니다.
    const orderId = /*[[${orderId}]]*/ 'STAGEON-TEST-0001';

    const baseUrl = window.location.origin;

    // 3. 토스 결제창 호출 (하드코딩 제거 및 변수 매핑)
    tossPayments.requestPayment('카드', {
      amount: amount,                 // 서버에서 계산된 실제 금액 적용
      orderId: orderId,               // 서버에서 생성된 고유 주문번호
      orderName: orderName,           // 예매하는 실제 공연명
      customerName: customerName,     // 예매자 이름
      customerEmail: customerEmail,   // 예매자 이메일
      successUrl: `${baseUrl}/payment/success`,
      failUrl: `${baseUrl}/payment/fail`
    });
  }
</script>
</body>
</html>
