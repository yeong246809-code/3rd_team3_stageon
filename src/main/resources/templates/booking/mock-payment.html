<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn | 결제 진행</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">

  <!-- 토스 페이먼츠 -->
  <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body id="top">
<div th:replace="~{fragments/booking/booking-header :: bookingHeader(4)}"></div>

<main class="booking-page">
  <div class="shell booking-grid">

    <section class="stack">
      <header class="page-heading">
        <span class="eyebrow">STEP 04 · PAYMENT</span>
        <h1>결제를 진행해 주세요</h1>
        <p>안전한 결제를 위해 토스페이먼츠(Toss Payments) 시스템을 사용합니다.</p>
      </header>

      <div class="card" style="margin-top:20px;">
        <h2>주문 및 예매자 정보</h2>
        <div style="margin-top:18px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
          <p style="margin-bottom: 8px;"><strong>이름:</strong> <span th:text="${paymentRequest.bookerName}">테스터</span></p>
          <p style="margin-bottom: 8px;"><strong>이메일:</strong> <span th:text="${paymentRequest.bookerEmail}">tester@example.com</span></p>
          <p style="margin-bottom: 8px;"><strong>연락처:</strong> <span th:text="${paymentRequest.bookerPhone}">010-1234-5678</span></p>
          <p style="margin-bottom: 8px;"><strong>수령 방법:</strong> <span th:text="${paymentRequest.receiveMethod.name() == 'MOBILE' ? '모바일 티켓' : '현장 수령'}">모바일 티켓</span></p>
          <p><strong>결제 예정 금액:</strong> <span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'" style="color: #f03e3e; font-weight: bold;">0원</span></p>

        </div>
      </div>

      <!-- 💡 결제 수단 선택 UI 추가 -->
      <div class="card" style="margin-top:20px;">
        <h2>결제 수단</h2>
        <div style="margin-top:18px; border: 1px solid #e5e8eb; border-radius: 8px; background-color: #fff; overflow: hidden;">

          <label style="display: flex; align-items: center; padding: 18px 16px; border-bottom: 1px solid #e5e8eb; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='#fff'">
            <input type="radio" name="payMethod" value="카드" checked style="width: 20px; height: 20px; margin-right: 14px; accent-color: #3182f6; cursor: pointer;">
            <span style="font-weight: 500; font-size: 16px; color: #333d4b;">신용/체크카드</span>
          </label>

          <label style="display: flex; align-items: center; padding: 18px 16px; border-bottom: 1px solid #e5e8eb; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='#fff'">
            <!-- 토스 간편결제 테스트용 -->
            <input type="radio" name="payMethod" value="토스페이" style="width: 20px; height: 20px; margin-right: 14px; accent-color: #3182f6; cursor: pointer;">
            <span style="font-weight: 500; font-size: 16px; color: #333d4b;">토스페이</span>
          </label>

          <label style="display: flex; align-items: center; padding: 18px 16px; border-bottom: 1px solid #e5e8eb; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='#fff'">
            <input type="radio" name="payMethod" value="가상계좌" style="width: 20px; height: 20px; margin-right: 14px; accent-color: #3182f6; cursor: pointer;">
            <span style="font-weight: 500; font-size: 16px; color: #333d4b;">가상계좌 (무통장입금)</span>
          </label>

          <label style="display: flex; align-items: center; padding: 18px 16px; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='#fff'">
            <input type="radio" name="payMethod" value="계좌이체" style="width: 20px; height: 20px; margin-right: 14px; accent-color: #3182f6; cursor: pointer;">
            <span style="font-weight: 500; font-size: 16px; color: #333d4b;">실시간 계좌이체</span>
          </label>

        </div>
      </div>

      <div class="notice notice--ai" style="margin-top:20px;">
        <b>테스트 결제 안내</b>
        · 현재 환경은 테스트 모드입니다. 실제 과금이 발생하지 않는 테스트용 카드를 사용해 주세요.
      </div>
    </section>

    <aside class="stack">
      <!-- 우측 서머리 조각 -->
      <div th:replace="~{fragments/booking/booking-summary :: summary}"></div>

      <!-- 💡 핵심 해결책: 서버에서 전달받은 실제 결제 금액을 숨겨두는 input 추가 -->
      <input type="hidden" id="hiddenTotalPrice" th:value="${totalPrice}">

      <button type="button" class="btn btn--primary btn--wide" onclick="requestPayment()">
        <span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">0원</span> 결제하기
      </button>

      <div style="margin-top: 15px; text-align: center;">
        <button type="button" class="btn btn--secondary btn--wide" onclick="cancelPayment()" style="background-color: #f8f9fa; color: #495057; border: 1px solid #ced4da;">결제 취소 (좌석 해제)</button>
      </div>
    </aside>
  </div>
</main>

<script th:inline="javascript">
  const tossPayments = TossPayments("test_ck_ORzdMaqN3wnw4wQk6KJB85AkYXQG");

  function requestPayment() {
    try {
      // 선택한 결제 수단 가져오기
      const radioInput = document.querySelector('input[name="payMethod"]:checked');
      if (!radioInput) {
        alert("결제 수단을 선택해 주세요.");
        return;
      }
      const selectedMethod = radioInput.value;

      // 💡 숨겨진 input 태그에서 금액을 읽어옵니다. (totalAmount 에러 완벽 해결!)
      const amountValue = document.getElementById('hiddenTotalPrice').value;
      const amount = Number(amountValue);

      // 금액 검증 안전장치
      if (!amount || isNaN(amount) || amount <= 0) {
        alert("결제 금액 정보가 올바르지 않습니다. (금액: " + amountValue + ")");
        return;
      }

      // Thymeleaf 변수 바인딩
      const orderName = /*[[${performanceTitle ?: 'StageOn 티켓 예매'}]]*/ 'StageOn 티켓 예매';
      const customerName = /*[[${paymentRequest.bookerName}]]*/ '테스터';
      const customerEmail = /*[[${paymentRequest.bookerEmail}]]*/ 'tester@example.com';
      const orderId = /*[[${orderId}]]*/ 'STAGEON-TEST-0001';
      const baseUrl = window.location.origin;

      console.log("🚀 토스 결제 요청:", { selectedMethod, amount, orderId });

      tossPayments.requestPayment(selectedMethod, {
        amount: amount,
        orderId: orderId,
        orderName: orderName,
        customerName: customerName,
        customerEmail: customerEmail,
        successUrl: `${baseUrl}/payment/success`,
        failUrl: `${baseUrl}/payment/fail`
      }).catch(function (error) {
        if (error.code === 'USER_CANCEL') {
          console.log("고객이 결제창을 닫았습니다.");
        } else {
          alert("결제창 호출 실패: " + error.message);
        }
      });

    } catch (e) {
      console.error("자바스크립트 실행 중 에러 발생:", e);
      alert("결제 처리 중 화면에 오류가 발생했습니다.");
    }
  }

  function cancelPayment() {
    alert("결제를 취소하고 이전 화면으로 돌아갑니다.");
    history.back();
  }
</script>
</body>
</html>
