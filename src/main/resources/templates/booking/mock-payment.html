<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 모의 결제</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/booking/booking-header :: bookingHeader}"></div>
    <main class="booking-page">
      <div class="shell booking-grid">
        <!-- STEP 04: 실제 승인이 없는 포트폴리오용 결제 시뮬레이션 -->
        <section class="stack">
          <header class="page-heading">
            <span class="eyebrow">STEP 04 · MOCK PAYMENT</span>
            <h1>모의 결제</h1>
            <p>실제 PG나 카드 승인은 발생하지 않습니다.</p>
          </header>
          <div class="notice notice--ai">
            <b>포트폴리오용 모의 결제</b>
            · 같은 멱등키의 요청은 결제 한 건으로 처리합니다.
          </div>
          <div class="card">
            <h2>결제 수단</h2>
            <div class="payment-methods" style="margin-top:18px">
              <button type="button" class="payment-method is-active">신용카드 시뮬레이션</button>
              <button type="button" class="payment-method">간편결제 시뮬레이션</button>
              <button type="button" class="payment-method">실패 상황 테스트</button>
            </div>
            <div class="field" style="margin-top:22px">
              <label>테스트 카드 번호</label>
              <input class="input" value="4242 4242 4242 4242" readonly>
            </div>
          </div>
          <div class="notice notice--danger">
            <b>실패 시나리오</b>
            · 결제 실패 시 예약을 취소하고 HELD 좌석을 AVAILABLE로 복구합니다.
          </div>
        </section>
        <aside class="stack">
          <div th:replace="~{fragments/booking/booking-summary :: summary}"></div>
          <a class="btn btn--primary btn--wide" th:href="@{/booking-complete}" href="/booking-complete">162,000원 모의 결제 완료</a>
        </aside>
      </div>
    </main>
  </body>
</html>
