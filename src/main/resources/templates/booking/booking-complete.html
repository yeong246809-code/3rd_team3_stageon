<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn | 예매 완료</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">
</head>
<body id="top">
<!-- 단계 표시가 있다면 마지막 단계(예: 5)로 설정 -->
<div th:replace="~{fragments/booking/booking-header :: bookingHeader(0)}"></div>
<main class="booking-page">
  <section class="complete-card card card--shadow">
    <!-- 결제 성공과 좌석 RESERVED 전환 결과 -->
    <div class="complete-check">✓</div>
    <span class="badge badge--success" th:text="${reservation.reservationStatus}">RESERVED</span>
    <h1 style="margin-top:14px">예매가 완료되었습니다</h1>
    <p class="section-copy">결제가 성공하고 좌석이 최종 예약 상태로 변경되었습니다.</p>

    <div class="card" style="margin-top:28px;text-align:left;background:var(--surface)">
      <dl class="info-list">
        <div>
          <dt>예매번호</dt>
          <dd>
            <b th:text="${reservation.bookingNumber}">STG-260815-0012</b>
          </dd>
        </div>
        <div>
          <dt>공연</dt>
          <dd th:text="${reservation.performanceTitle}">뮤지컬 〈오페라의 유령〉</dd>
        </div>
        <div>
          <dt>일시</dt>
          <!-- 날짜 포맷팅 적용 -->
          <dd th:text="${#temporals.format(reservation.startsAt, 'yyyy.MM.dd (E) HH:mm')}">2026.08.15 (토) 19:00</dd>
        </div>
        <div>
          <dt>좌석</dt>
          <dd>
            <!-- 여러 좌석일 경우 반복문으로 출력 -->
            <th:block th:each="seat, iterStat : ${reservation.seats}">
              <span th:text="${seat.gradeName} + ' ' + ${seat.sectionName} + ' ' + ${seat.rowLabel} + ' ' + ${seat.seatNumber} + ''">VIP A구역 8열 12번</span>
              <br th:if="${!iterStat.last}"/>
            </th:block>
          </dd>
        </div>
        <div>
          <dt>결제</dt>
          <dd>
            <span th:text="${#numbers.formatInteger(reservation.totalAmount, 0, 'COMMA')} + '원 · SUCCESS'">162,000원 · SUCCESS</span>
          </dd>
        </div>
      </dl>
    </div>

    <div class="cluster" style="justify-content:center;margin-top:24px">
      <button type="button" class="btn btn--primary" th:onclick="|closeAndPopupRedirect('@{/mypage}')|">예매내역 확인</button>
      <button type="button" class="btn" th:onclick="|closeAndPopupRedirect('@{/}')|">홈으로</button>
    </div>
  </section>
</main>

<script>
  function closeAndPopupRedirect(targetUrl) {
    // 부모 창(원래 메인 창)이 살아있다면
    if (window.opener && !window.opener.closed) {
      // 부모 창의 URL을 변경 (페이지 이동)
      window.opener.location.href = targetUrl;
    }

    // 부모 창이 이미 꺼졌든, 잘 이동했든 상관없이 이 팝업창은 깔끔하게 종료
    window.close();
  }
</script>

</body>
</html>
