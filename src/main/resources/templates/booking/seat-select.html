<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageOn | 좌석 선택</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
  <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">
</head>
<body id="top">
<div th:replace="~{fragments/booking/booking-header :: bookingHeader(2)}"></div>

<div th:if="${errorMessage}" class="notice notice--danger" style="margin-bottom:18px">
  <b th:text="${errorMessage}">에러 메시지</b>
</div>

<main class="booking-page">
  <div class="shell booking-grid">

    <section>
      <header class="page-heading">
        <div class="cluster" style="justify-content:space-between">
          <div>
            <span class="eyebrow">STEP 02</span>
            <h1>좌석을 선택하세요</h1>
          </div>
          <div>
            <small>선점 만료까지</small>
            <div class="timer">10:00</div>
          </div>
        </div>
      </header>

      <div class="notice notice--danger" style="margin-bottom:18px">
        <b>좌석 선택 충돌</b>
        · 다른 사용자가 먼저 선점한 좌석은 최신 상태 조회 후 선택할 수 있습니다.
      </div>

      <div class="card">
        <div class="seat-stage">STAGE</div>

        <th:block th:each="section : ${groupedSeats}">

          <h3 style="text-align: center; margin: 20px 0 10px; font-size: 1.1rem;" th:text="${section.key}">A구역</h3>

          <div class="seat-map" aria-label="좌석 배치도">
            <th:block th:with="uniqueRows=${#sets.toSet(section.value.![row])}">
              <div class="seat-row" th:each="rowLabel : ${#lists.sort(uniqueRows)}">

                <!-- 🚨 임시 선점(HELD) 구분을 없애고, 선택 불가능한 모든 좌석을 회색(#ccc)으로 렌더링 -->
                <th:block th:each="seat : ${section.value}">
                  <button th:if="${seat.row == rowLabel}"
                          class="seat"
                          th:classappend="${seat.status != 'AVAILABLE'} ? 'is-disabled' : ''"
                          th:style="${seat.status == 'AVAILABLE'} ? 'background-color: ' + ${seat.displayColor} : 'background-color: #ccc; border-color: #ccc;'"
                          th:data-original-color="${seat.displayColor}"
                          th:data-seat-id="${seat.id}"
                          th:data-seat-name="|${seat.section} ${seat.row}열 ${seat.number}번|"
                          th:data-seat-price="${seat.price}"
                          th:disabled="${seat.status != 'AVAILABLE'}"
                          onclick="selectSeat(this)">
                  </button>
                </th:block>

              </div>
            </th:block>
          </div>
        </th:block>

      </div>
    </section>

    <aside class="stack">
      <!-- ⭐ 가격표가 포함된 summary 프래그먼트를 불러옵니다 ⭐ -->
      <div th:replace="~{fragments/booking/booking-summary :: summary}"></div>

      <form id="holdForm" th:action="@{/booking/seats/hold}" method="post" style="width: 100%;">
        <input type="hidden" name="memberId" value="1">
        <input type="hidden" name="scheduleId" th:value="${scheduleId}">
        <!-- 좌석 선택 시 동적으로 생성되는 input들이 여기에 추가됨 -->
        <button type="button" class="btn btn--primary btn--wide" onclick="submitHold()">결제하기</button>
      </form>
    </aside>

  </div>
</main>

<script th:inline="javascript">
  // 1. 서버에서 설정된 최대 예매 매수 가져오기
  const MAX_TICKETS = /*[[${maxTickets ?: 4}]]*/ 4;

  // 선택한 좌석 데이터를 담아둘 Map
  let selectedSeats = new Map();

  // 유령 좌석 취소 시 사용할 현재 홀드 ID
  let currentSeatHoldId = null;
  let isSubmitting = false;

  // 2. 좌석 클릭 이벤트
  async function selectSeat(button) {
    const seatId = button.getAttribute('data-seat-id');
    const seatName = button.getAttribute('data-seat-name');
    const seatPrice = parseFloat(button.getAttribute('data-seat-price'));

    if (selectedSeats.has(seatId)) {
      // [1] 이미 선택된 좌석을 다시 클릭한 경우 -> 선택 해제
      selectedSeats.delete(seatId);
      button.classList.remove('is-selected');
      button.style.border = "";
      updateSummaryPanel();

      // 🚨 락 해제 API 호출 추가 (선택 취소 시 즉시 자물쇠 풀기)
      navigator.sendBeacon(`/api/seats/${seatId}/uncheck`);
    } else {
      // 새로운 좌석 클릭 -> 최대 매수 검증
      if (selectedSeats.size >= MAX_TICKETS) {
        alert(`해당 공연의 1인 최대 예매 가능 매수(${MAX_TICKETS}매)를 초과했습니다.`);
        return;
      }

      try {
        // 서버에 좌석 상태(다른 사람이 선점했는지) 확인 요청
        const response = await fetch(`/api/seats/${seatId}/check`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
          const errorText = await response.text();
          try {
            const errorJson = JSON.parse(errorText);
            alert("시스템 오류: " + (errorJson.message || errorJson.error));
          } catch (e) {
            alert(errorText);
          }
          return;
        }

        // 검증 통과 시 UI 반영
        selectedSeats.set(seatId, { name: seatName, price: seatPrice });
        button.classList.add('is-selected');
        button.style.border = "3px solid #000";

        updateSummaryPanel();

      } catch (error) {
        console.error("좌석 상태 확인 중 오류:", error);
        alert("좌석 상태를 확인하는 중 서버 오류가 발생했습니다.");
      }
    }
  }

  // 3. 우측 Summary 패널 갱신
  function updateSummaryPanel() {
    const container = document.getElementById('dynamic-seat-container');
    const summaryCountEl = document.getElementById('summary-seat-count');
    const summaryPriceEl = document.getElementById('summary-seat-price');
    const formContainer = document.getElementById('holdForm');

    // 선택된 좌석이 없을 때
    if (selectedSeats.size === 0) {
      if (container) {
        container.innerHTML = `
              <div>
                  <dt>좌석</dt>
                  <dd style="color: #ff5252;">좌석을 선택해주세요</dd>
              </div>`;
      }
      if (summaryCountEl) summaryCountEl.innerText = '0매';
      if (summaryPriceEl) summaryPriceEl.innerText = '0원';

      document.querySelectorAll('.dynamic-seat-input').forEach(el => el.remove());
      return;
    }

    let seatsHTML = '';
    let totalPrice = 0;

    document.querySelectorAll('.dynamic-seat-input').forEach(el => el.remove());

    // 선택된 좌석만큼 DOM 렌더링 및 Form 데이터 생성
    selectedSeats.forEach((value, key) => {
      seatsHTML += `
          <div>
              <dt>좌석</dt>
              <dd style="font-weight: bold; color: #ff5252;">${value.name}</dd>
          </div>`;
      totalPrice += value.price;

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'scheduleSeatIds';
      input.value = key;
      input.className = 'dynamic-seat-input';
      formContainer.appendChild(input);
    });

    if (container) container.innerHTML = seatsHTML;
    if (summaryCountEl) summaryCountEl.innerText = selectedSeats.size + '매';
    if (summaryPriceEl) summaryPriceEl.innerText = totalPrice.toLocaleString() + '원';
  }

  // 4. 결제하기 버튼 클릭
  function submitHold() {
    if (selectedSeats.size === 0) {
      alert('좌석을 먼저 선택해주세요.');
      return;
    }
    isSubmitting = true; // 폼 제출 시에는 이탈 감지 스크립트가 돌지 않도록 설정
    document.getElementById('holdForm').submit();
  }

  // 5. 10분 타이머
  window.onload = function () {
    let time = 600; // 10분 = 600초
    let timerElement = document.querySelector('.timer');

    if (!timerElement) return;

    let interval = setInterval(function () {
      let minutes = Math.floor(time / 60);
      let seconds = time % 60;

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      timerElement.textContent = minutes + ":" + seconds;

      if (--time < 0) {
        clearInterval(interval);
        alert("시간이 초과되었습니다. 처음부터 다시 진행해 주세요.");
        window.location.reload();
      }
    }, 1000);
  };

  // 6. 실시간 좌석 상태 업데이트 (SSE)
  const eventSource = new EventSource('/api/seats/stream');

  eventSource.addEventListener('seatStatus', function(event) {
    const data = JSON.parse(event.data);
    const seatBtn = document.querySelector(`button[data-seat-id='${data.seatId}']`);

    if (seatBtn) {
      if (data.status === 'AVAILABLE') {
        seatBtn.classList.remove('is-disabled', 'is-held');
        seatBtn.disabled = false;
        seatBtn.style.backgroundColor = seatBtn.getAttribute('data-original-color');
        seatBtn.style.borderColor = ''; // 회색 테두리도 원래대로 복구
        seatBtn.style.opacity = '1';
      }
      else if (data.status === 'HELD' || data.status === 'RESERVED') {
        seatBtn.classList.add('is-disabled');
        seatBtn.disabled = true;
        seatBtn.style.backgroundColor = '#ccc';
        seatBtn.style.borderColor = '#ccc';

        if (selectedSeats.has(data.seatId.toString())) {
          selectedSeats.delete(data.seatId.toString());
          seatBtn.classList.remove('is-selected');
          seatBtn.style.border = "";
          updateSummaryPanel();
        }
      }
    }
  });

  eventSource.onerror = function(err) {
    console.error("실시간 연결에 문제가 발생했습니다.", err);
  };

  // ==========================================
  // 🚨 유령 좌석(Ghost Seat) 방지 및 임시 선점 해제 로직
  // ==========================================

  function releaseHoldOnExit() {
    if (!isSubmitting) {
      // 1. 내가 클릭해서 장바구니에 담아둔(Map) 좌석들을 싹 다 돌면서 Redis 락 해제
      selectedSeats.forEach((value, seatId) => {
        navigator.sendBeacon(`/api/seats/${seatId}/uncheck`);
      });

      // 2. 화면에 숨겨져 있거나 JS 변수로 가지고 있는 seatHoldId 취소
      const seatHoldInput = document.querySelector('input[name="seatHoldId"]');
      const holdId = seatHoldInput ? seatHoldInput.value : currentSeatHoldId;

      if (holdId) {
        navigator.sendBeacon(`/api/seats/holds/${holdId}/cancel`);
      }
    }
  }

  // 새로고침(F5) 감지 시 취소 API 호출
  window.addEventListener('beforeunload', function(e) {
    const navigationEntries = performance.getEntriesByType('navigation');
    if (navigationEntries.length > 0 && navigationEntries[0].type === 'reload') {
      releaseHoldOnExit();
    }
  });

  // 모바일 등에서 브라우저가 백그라운드로 넘어갈 때 감지
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      releaseHoldOnExit();
    }
  });

  // 브라우저 뒤로가기 또는 탭 닫기 감지
  window.addEventListener('pagehide', function() {
    releaseHoldOnExit();
  });

  window.addEventListener('pageshow', function(event) {
    // 브라우저 뒤로가기 버튼을 통해 진입했음이 감지되면, 깔끔하게 페이지를 강제 새로고침
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
      window.location.reload();
    }
  });
</script>
</body>
</html>
