<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 대기열</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/booking-pages.css}" href="/css/pages/booking-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/booking/booking-header :: bookingHeader(step=2)}"></div>
    <main class="booking-page" th:with="status=${queueInfo != null ? queueInfo.status : 'WAITING'}">
      <section class="queue-box">
        <header class="page-heading">
          <span class="eyebrow">REDIS WAITING QUEUE</span>
          <h1 th:text="${status == 'ENTERED' ? '입장 순서가 되었습니다!' : (status == 'EXPIRED' ? '대기열 토큰이 만료되었습니다' : '예매 대기 중입니다')}">예매 대기 중입니다</h1>
          <p th:text="${status == 'ENTERED' ? '잠시 후 좌석 선택 화면으로 자동 이동합니다...' : (status == 'EXPIRED' ? '유효 시간이 지나 대기열에서 제외되었습니다. 회차를 다시 선택해주세요.' : '순서가 되면 입장 토큰이 발급되고 좌석 선택 화면으로 이동할 수 있습니다.')}">순서가 되면 입장 토큰이 발급되고 좌석 선택 화면으로 이동할 수 있습니다.</p>
        </header>

        <div class="card card--shadow">
          <span class="badge"
                th:classappend="${status == 'WAITING' ? 'badge--warning' : (status == 'ENTERED' ? 'badge--success' : '')}"
                th:text="${status}">WAITING</span>

          <div th:if="${status == 'WAITING'}">
            <p style="margin-top:16px">현재 내 앞 대기 인원</p>
            <div id="queueWaitingOrder" class="queue-count" th:text="${#numbers.formatInteger(queueInfo?.waitingOrder ?: 0, 1, 'COMMA')}">0</div>
            <div class="progress">
              <i id="queueProgress" th:style="'width:' + ${queueInfo?.progressPercentage ?: 5} + '%'"></i>
            </div>
            <p id="queueEstimate" class="section-copy" style="margin-top:14px"
               th:text="|예상 대기 시간 약 ${queueInfo?.estimatedMinutes ?: 4}분 · 화면을 닫지 마세요.|">예상 대기 시간 약 4분 · 화면을 닫지 마세요.</p>
          </div>

          <div th:if="${status == 'ENTERED'}" style="margin-top:24px; text-align:center;">
            <p class="section-copy" style="font-size:1.1rem; color:#111; font-weight:600;">입장 권한이 확인되었습니다.</p>
            <p class="section-copy" style="margin-top:8px;">좌석 배치도로 이동 중입니다. 잠시만 기다려주세요...</p>
          </div>

          <div th:if="${status == 'EXPIRED'}" style="margin-top:24px; text-align:center;">
            <p class="section-copy" style="color:#d9534f;">입장 가능 시간이 초과되어 권한이 소멸되었습니다.</p>
            <p class="section-copy" style="margin-top:8px;">원하는 좌석 선점을 위해 회차 선택부터 다시 시도해주세요.</p>
          </div>
        </div>

        <div th:if="${status != 'ENTERED'}" class="cluster" style="justify-content:center;margin-top:24px">
          <a class="btn" th:href="@{/booking/performances/{id}/schedules(id=${queueInfo?.performanceId ?: 1})}">회차 다시 선택</a>
        </div>
      </section>
    </main>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const status = /*[[${queueInfo?.status ?: 'WAITING'}]]*/ 'WAITING';
      const scheduleId = /*[[${queueInfo?.scheduleId ?: 1}]]*/ 1;

      if (status === 'ENTERED') {
        // ENTERED 상태면 1.5초 뒤 좌석 선택 페이지로 자동 이동 (replace를 써서 뒤로가기 방지)
        setTimeout(() => {
          window.location.replace(`/booking/seats?scheduleId=${encodeURIComponent(scheduleId)}`);
        }, 1500);
      } else if (status === 'WAITING') {
        let pollDelay = 1000;

        const pollQueueStatus = async () => {
          try {
            const response = await fetch(
                    `/api/waiting-queue/status?scheduleId=${encodeURIComponent(scheduleId)}`,
                    {headers: {Accept: 'application/json'}, cache: 'no-store'}
            );
            if (response.status === 401 || response.redirected) {
              window.location.replace('/login?required');
              return;
            }
            if (!response.ok) {
              throw new Error('대기열 상태를 확인할 수 없습니다.');
            }

            const queueInfo = await response.json();
            if (queueInfo.status === 'ENTERED') {
              window.location.replace(`/booking/seats?scheduleId=${encodeURIComponent(scheduleId)}`);
              return;
            }
            if (queueInfo.status === 'EXPIRED') {
              window.location.reload();
              return;
            }

            const currentOrder = Number(queueInfo.waitingOrder || 0);

            document.getElementById('queueWaitingOrder').textContent =
                    Number(queueInfo.waitingOrder || 0).toLocaleString('ko-KR');
            document.getElementById('queueProgress').style.width =
                    `${queueInfo.progressPercentage || 5}%`;
            document.getElementById('queueEstimate').textContent =
                    `예상 대기 시간 약 ${queueInfo.estimatedMinutes || 1}분 · 화면을 닫지 마세요.`;

            if (currentOrder > 1000) {
              pollDelay = 10000;
            } else if (currentOrder > 300) {
              pollDelay = 5000;
            } else if (currentOrder > 50) {
              pollDelay = 3000;
            } else {
              pollDelay = 1000; // 혼자 남았거나 입장 직전이면 1초마다 빠르게 찌릅니다.
            }

          } catch (error) {
            console.error(error);
            pollDelay = Math.min(10000, pollDelay + 2000);
          }
          window.setTimeout(pollQueueStatus, pollDelay);
        };

        window.setTimeout(pollQueueStatus, pollDelay);
      }
      /*]]>*/
    </script>
  </body>
</html>
