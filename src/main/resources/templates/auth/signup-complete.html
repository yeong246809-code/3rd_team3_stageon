<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 회원가입 완료</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}"
          href="/css/app.css">

    <link rel="stylesheet"
          th:href="@{/css/pages/public-pages.css}"
          href="/css/pages/public-pages.css">

    <link rel="stylesheet"
          th:href="@{/css/pages/signup-complete.css}"
          href="/css/pages/signup-complete.css">
</head>
<body id="top">

<div th:replace="~{fragments/common/site-header :: header}"></div>

<main class="signup-complete-page">
    <section class="signup-complete-card">

        <div class="signup-complete-icon" aria-hidden="true">
            <span>✓</span>
        </div>

        <p class="signup-complete-eyebrow">WELCOME TO STAGEON</p>

        <h1>회원가입이 완료되었습니다.</h1>

        <p class="signup-complete-description">
            StageOn 회원이 되신 것을 환영합니다.<br>
            로그인 후 공연 정보 확인과 예매 서비스를 이용할 수 있습니다.
        </p>

        <div class="signup-complete-guide">
            <div>
                <span class="signup-complete-guide__number">1</span>
                <strong>로그인</strong>
                <p>가입한 이메일과 비밀번호로 로그인해 주세요.</p>
            </div>

            <div>
                <span class="signup-complete-guide__number">2</span>
                <strong>공연 탐색</strong>
                <p>원하는 공연의 날짜와 회차를 확인해 주세요.</p>
            </div>

            <div>
                <span class="signup-complete-guide__number">3</span>
                <strong>예매 시작</strong>
                <p>좌석을 선택하고 예매를 진행할 수 있습니다.</p>
            </div>
        </div>

        <div class="signup-complete-actions">
            <a class="signup-complete-button signup-complete-button--primary"
               th:href="@{/login}"
               href="/login">
                로그인하기
            </a>

            <a class="signup-complete-button signup-complete-button--secondary"
               th:href="@{/}"
               href="/">
                메인으로 이동
            </a>
        </div>

        <p class="signup-complete-notice">
            입력한 개인정보는 StageOn 서비스 제공을 위해 안전하게 관리됩니다.
        </p>

    </section>
</main>

<div th:replace="~{fragments/common/site-footer :: footer}"></div>
<div th:replace="~{fragments/common/floating-actions :: floatingActions}"></div>

</body>
</html>
