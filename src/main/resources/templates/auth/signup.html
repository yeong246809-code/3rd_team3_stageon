<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageOn | 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/pages/public-pages.css}" href="/css/pages/public-pages.css">
  </head>
  <body id="top">
    <div th:replace="~{fragments/common/site-header :: header}"></div>
    <main class="page page--soft">
      <div class="auth-wrap card card--shadow auth-card">
        <!-- MemberSignupRequest 검증 규칙과 일치하는 회원가입 입력 화면 -->
        <h1>회원가입</h1>
        <p class="section-copy" style="text-align:center">필수 정보만 입력하면 바로 시작할 수 있어요.</p>
        <form>
          <div class="field">
            <label for="signup-email">이메일</label>
            <input id="signup-email" class="input" type="email" autocomplete="email" placeholder="이메일 주소">
          </div>
          <div class="field">
            <label for="signup-name">이름</label>
            <input id="signup-name" class="input" autocomplete="name" placeholder="이름">
          </div>
          <div class="field">
            <label for="signup-password">비밀번호</label>
            <input id="signup-password" class="input" type="password" autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상">
          </div>
          <div class="field">
            <label for="signup-password-confirm">비밀번호 확인</label>
            <input id="signup-password-confirm" class="input" type="password" autocomplete="new-password" placeholder="비밀번호 다시 입력">
          </div>
          <label><input type="checkbox">이용약관과 개인정보처리방침에 동의합니다.</label>
          <a class="btn btn--primary btn--wide" th:href="@{/login}" href="/login">가입 시안 완료 후 로그인</a>
        </form>
      </div>
    </main>
    <div th:replace="~{fragments/common/site-footer :: footer}"></div>
    <div th:replace="~{fragments/common/floating-actions :: floatingActions}"></div>
  </body>
</html>
