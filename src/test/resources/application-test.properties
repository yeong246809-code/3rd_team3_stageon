spring.datasource.url=jdbc:h2:mem:stageon-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=

spring.mail.username=test@stageon.local
spring.mail.password=test-password

stageon.error.show-full-log=true
stageon.storage.type=local
stageon.storage.local-root=build/test-media

# 테스트에서는 만료 검증 시간을 줄이고 운영 기본값(10분)과 분리합니다.
stageon.queue.admission-ttl=2s
stageon.queue.waiting-ttl=30s
stageon.queue.process-interval-ms=100
stageon.queue.expiration-scan-interval-ms=1000
stageon.queue.admit-batch-size=10
stageon.queue.cookie-secure=false
